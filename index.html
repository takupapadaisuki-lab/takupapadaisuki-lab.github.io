<script>
(function(){
  var KEY='fequiz-state-v1';
  var SKEY='fequiz-synckey';
  var ATKEY='fequiz-syncat';
  var mem=null;
  function loadLocal(){ try{ var s=localStorage.getItem(KEY); if(s){ mem=JSON.parse(s); return mem; } }catch(e){} return null; }
  function saveLocal(st){ mem=st; try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  function getKey(){ try{ var k=localStorage.getItem(SKEY); if(k && k.length>=16) return k; var nk=(window.crypto && crypto.randomUUID)? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)); localStorage.setItem(SKEY, nk); return nk; }catch(e){ return null; } }
  function getAt(){ try{ return parseInt(localStorage.getItem(ATKEY)||'0',10)||0; }catch(e){ return 0; } }
  function setAt(t){ try{ localStorage.setItem(ATKEY, String(t)); }catch(e){} }
  var dirty=false;
  var pushTimer=null;
  var db=null, docRef=null, fsMod=null;
  function push(){
    if(!db || !docRef || !fsMod) return;
    var st=mem || loadLocal(); if(!st) return;
    var t=Date.now(); setAt(t);
    fsMod.setDoc(docRef, {state: st, updatedAt: t}).catch(function(){});
  }
  function schedulePush(){ if(pushTimer) clearTimeout(pushTimer); pushTimer=setTimeout(push, 800); }
  function adopt(remoteState, remoteAt){
    saveLocal(remoteState); setAt(remoteAt);
    try{ window.dispatchEvent(new CustomEvent('hatch-widget-state', {detail:{state: remoteState}})); }catch(e){}
  }
  window.hatchWidget={
    getState:function(def){ var m=loadLocal(); if(m) return Object.assign({}, def, m); return Object.assign({}, def); },
    setState:function(st){ saveLocal(st); dirty=true; schedulePush(); }
  };
  function buildSyncBox(){
    if(document.getElementById('syncbox')) return;
    var wrap=document.querySelector('.wrap'); if(!wrap) return;
    var box=document.createElement('div'); box.id='syncbox'; box.className='syncbox';
    var label=document.createElement('div'); label.className='syncbox-label'; label.textContent='同期キー（スマホとPCで同じ記録にするためのキー）';
    var row=document.createElement('div'); row.className='syncbox-row';
    var code=document.createElement('code'); code.className='syncbox-key'; code.textContent=getKey()||'';
    var btnCopy=document.createElement('button'); btnCopy.className='btn syncbox-btn'; btnCopy.textContent='コピー';
    btnCopy.addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText(getKey()); btnCopy.textContent='コピーしました'; setTimeout(function(){ btnCopy.textContent='コピー'; },1500); });
    var btnSet=document.createElement('button'); btnSet.className='btn syncbox-btn'; btnSet.textContent='キーを切り替える';
    btnSet.addEventListener('click', function(){ var nk=window.prompt('もう一方の端末の同期キーを入力してください'); if(nk && nk.trim().length>=16){ try{ localStorage.setItem(SKEY, nk.trim()); }catch(e){} location.reload(); } });
    row.appendChild(code); row.appendChild(btnCopy); row.appendChild(btnSet);
    box.appendChild(label); box.appendChild(row);
    wrap.appendChild(box);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', buildSyncBox); else buildSyncBox();
  var config={apiKey:"AIzaSyDOugjJBZF8bJgtOZ-ZPJIpGiSd0zcwmc8",authDomain:"fe-quiz-sync.firebaseapp.com",projectId:"fe-quiz-sync",storageBucket:"fe-quiz-sync.firebasestorage.app",messagingSenderId:"624934588626",appId:"1:624934588626:web:db74c2f5c3a6d521311d0b"};
  Promise.all([
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
  ]).then(function(mods){
    var appMod=mods[0]; fsMod=mods[1];
    var app=appMod.initializeApp(config);
    db=fsMod.getFirestore(app);
    var key=getKey(); if(!key) return;
    docRef=fsMod.doc(db, 'sync', key);
    return fsMod.getDoc(docRef).then(function(snap){
      if(snap.exists()){
        var d=snap.data();
        if(d && d.state && d.updatedAt && d.updatedAt>getAt() && !dirty){ adopt(d.state, d.updatedAt); }
      } else {
        if(loadLocal()) push();
      }
      fsMod.onSnapshot(docRef, function(snap2){
        if(!snap2.exists()) return;
        var d2=snap2.data();
        if(d2 && d2.state && d2.updatedAt && d2.updatedAt>getAt() && !dirty){ adopt(d2.state, d2.updatedAt); }
      });
    });
  }).catch(function(){});
})();
</script>
<style>
:root{--bg:#0b0d13;--surface:#151926;--surface2:#1b2131;--stroke:#30374a;--text:#f5f7fd;--muted:#a1acc0;--accent:#aa93ff;--accent2:#7c6bfa;--green:#61d7a5}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(140deg,#141325 0,#0b0d13 40%,#0d1420 100%) fixed;color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
button{font:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:clamp(22px,3.5vw,30px);letter-spacing:-.02em;margin:4px 0 8px;line-height:1.3}
.sub{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{display:block;width:100%;text-align:left;padding:12px 13px;border:1px solid var(--stroke);border-radius:11px;background:#202538;color:var(--text);font-size:15px}
.btn small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default}
.btn.accent{background:#504486;border:2px solid #bfabff;color:#fff;text-align:center}
.btn.accent small{color:#fff;opacity:.85}
.bar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.bar .btn{width:auto;padding:10px 13px;font-size:13px;text-align:center}
.qmeta{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.06em;margin-bottom:8px}
.qrate{color:var(--muted);font-size:13px;margin-bottom:10px}
.qtext{font-size:16px;line-height:1.7;white-space:pre-wrap;margin-bottom:16px}
.choices{display:grid;gap:9px}
.choice{text-align:left;padding:13px;border:1px solid #505772;border-radius:13px;background:#272c41;color:var(--text);font-size:15px;width:100%;line-height:1.55}
.choice .lab{color:var(--muted);margin-right:8px;font-weight:700}
.choice:hover{border-color:#b5a3ff;background:#34314e}
.choice.right{border:2px solid var(--green);background:rgba(97,215,165,.13)}
.choice.wrong{border:2px solid #e05d5d;background:rgba(224,93,93,.13)}
.choice:disabled{cursor:default}
.exp{margin-top:14px;padding:14px 16px;border:1px solid #32354a;border-radius:13px;background:rgba(23,27,43,.85);font-size:14px;line-height:1.7;white-space:pre-wrap}
.verdict{font-weight:800;margin-bottom:4px}
.ok{color:var(--green)}.ng{color:#ff9c9c}
.next{margin-top:14px}
.score{font-size:25px;font-weight:780;line-height:1.15;margin:10px 0;font-variant-numeric:tabular-nums}
.airow{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.airow .btn{width:auto;padding:10px 13px;font-size:13px;text-align:center}
.aihead{font-size:13px;color:var(--muted);margin-top:16px}
.witem{border:1px solid var(--stroke);border-radius:13px;background:rgba(23,27,40,.94);padding:14px 16px;margin-top:10px}
.witem .wq{font-size:14px;line-height:1.7;white-space:pre-wrap}
.witem .wa{font-size:13px;margin-top:6px}
.witem .we{font-size:13px;line-height:1.7;white-space:pre-wrap;margin-top:6px;color:var(--muted)}
.hidden{display:none}
.syncbox{margin-top:26px;border:1px solid var(--stroke);border-radius:13px;background:rgba(23,27,43,.85);padding:14px 16px}
.syncbox-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.syncbox-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.syncbox-key{font-size:12px;word-break:break-all;flex:1;min-width:180px}
.syncbox-btn{width:auto;padding:8px 12px;font-size:13px;text-align:center}
@media(max-width:720px){.wrap{padding:15px 12px 55px}.grid{grid-template-columns:1fr}}

保持する","演算結果を一時的に保持する","主記憶から読み出した命令そのものを保持する","入出力データを受け渡す"],"exp":"プログラムカウンタは、次に実行すべき命令が格納されている主記憶のアドレスを保持する。","q":"プログラムカウンタ（プログラムレジスタ）の役割として、適切なものはどれか。"},{"q":"CPUのレジスタのうち、演算結果を一時的に保持しておくものはどれか。","choices":["プログラムカウンタ","アキュムレータ","命令レジスタ","スタックポインタ"],"answer":1,"exp":"アキュムレータは、演算装置での演算結果を一時的に保持するレジスタである。プログラムカウンタは、次に実行する命令のアドレスを保持する。"},{"q":"クロック周波数 1GHz、平均CPIが4のCPUで、1,000万命令のプログラムを実行するのに要する時間は何秒か。","choices":["0.004秒","0.04秒","0.4秒","4秒"],"answer":1,"exp":"実行時間は、命令数×CPI÷クロック周波数で求める。1,000万×4÷10億＝0.04秒である。"}],"title":"CPU"},{"id":"1-04","questions":[{"q":"命令の実行過程で、命令解読の後、オペランド読出しの前に行われる処理はどれか。","choices":["実効アドレス計算","命令フェッチ","演算の実行","結果の格納"],"answer":0,"exp":"命令は、フェッチ、解読、実効アドレス計算、オペランド読出し、実行の順に処理される。実効アドレス計算は、解読とオペランド読出しの間に行われる。"},{"q":"命令の実行サイクルの順序として、正しいものはどれか。","choices":["解読 → フェッチ → 実行","フェッチ → 解読 → 実行","実行 → フェッチ → 解読","フェッチ → 実行 → 解読"],"answer":1,"exp":"命令は、主記憶から取り出すフェッチ、内容を解釈する解読、処理を行う実行の順に進む。"},{"answer":1,"choices":["割込みが発生すると、実行中のプログラムを破棄して電源を切る","割込みが発生すると、現在の状態を退避して割込み処理ルーチンを実行し、終了後に元の処理へ復帰する","割込みは、プログラムの実行が全て終了した後にまとめて処理される","割込みが発生すると、主記憶の内容が全て消去される"],"exp":"割込み処理ではレジスタなどの状態を退避してから処理ルーチンを実行し、終了後に状態を復元して元の処理を再開する。","q":"割込み処理の説明として、適切なものはどれか。"},{"q":"実効アドレス計算の説明として、適切なものはどれか。","choices":["命令のアドレス部とインデックスレジスタの値などから、オペランドの実際のアドレスを求める処理","命令を主記憶から命令レジスタへ取り出す処理","演算結果をレジスタへ書き込む処理","次に実行する命令のアドレスを決める処理"],"answer":0,"exp":"実効アドレス計算は、命令のアドレス指定に基づいてオペランドの実アドレスを求める処理で、解読の後、オペランド読出しの前に行われる。"}],"title":"CPUの動作原理"},{"id":"1-05","questions":[{"q":"5ステージのパイプラインで、1ステージの処理時間が2ナノ秒のとき、100個の命令を実行するのに要する時間は何ナノ秒か。パイプラインの乱れはないものとする。","choices":["200ナノ秒","208ナノ秒","500ナノ秒","1,000ナノ秒"],"answer":1,"exp":"パイプラインの実行時間は、（ステージ数＋命令数－1）×1ステージの時間で求める。（5＋100－1）×2＝208ナノ秒である。"},{"q":"パワーゲーティングの説明として、適切なものはどれか。","choices":["使用していない回路ブロックへの電源供給を遮断し、消費電力を抑える技術","クロック周波数を上げて処理を高速化する技術","複数のコアで命令を並列に実行する技術","キャッシュの容量を増やしてヒット率を上げる技術"],"answer":0,"exp":"パワーゲーティングは、使っていない回路への給電を止めることで漏れ電力を減らす省電力技術である。"},{"answer":2,"choices":["1つのCPUコアのクロック周波数を2倍にする技術である","キャッシュメモリの容量を2倍にする技術である","1つのプロセッサパッケー xp":"モーフィングは、始点の画像から終点の画像へ中間画像を生成し、滑らかに変化させる技法である。輪郭のぎざぎざを滑らかにするのはアンチエイリアシング、表面へ画像を貼り付けるのはテクスチャマッピングである。"}],"title":"マルチメディア"},{"id":"3-01","title":"基数変換","questions":[{"q":"10進数 45 を2進数で表したものはどれか。","choices":["101101","101011","110101","100111"],"answer":0,"exp":"45＝32＋8＋4＋1 なので、2進数では 101101 になる。"},{"q":"2進数 1101.01 を10進数で表したものはどれか。","choices":["13.5","12.25","13.25","14.5"],"answer":2,"exp":"整数部は 8＋4＋1＝13、小数部は 0.25 なので、合計 13.25 になる。"},{"q":"16進数 2F を10進数で表したものはどれか。","choices":["45","47","52","57"],"answer":1,"exp":"2F＝2×16＋15＝47 である（Fは15を表す）。"},{"q":"10進数 0.625 を2進数で表したものはどれか。","choices":["0.011","0.110","0.1001","0.101"],"answer":3,"exp":"0.625＝0.5＋0.125＝2^-1＋2^-3 なので、2進数では 0.101 になる。"}]},{"id":"3-02","title":"補数と固定小数点","questions":[{"q":"8ビットの2の補数表現で −5 を表したものはどれか。","choices":["10000101","11111011","11111010","00000101"],"answer":1,"exp":"5 は 00000101 で、そのビットを反転して1を加えると 11111011 になり、これが −5 の2の補数表現である。"},{"q":"8ビットの2の補数表現 11110000 が表す10進数はどれか。","choices":["−16","240","−15","−240"],"answer":0,"exp":"最上位ビットが1なので負の数であり、符号なしの値 240 から 256 を引いて −16 になる。"},{"q":"8ビットの2の補数表現で表せる整数の範囲はどれか。","choices":["−127〜127","0〜255","−255〜0","−128〜127"],"answer":3,"exp":"2の補数表現では負側が1つ多く、8ビットでは −128 から 127 までを表せる。"},{"q":"8ビットの2の補数表現を用いて 7−5 を計算した結果（10進数）はどれか。","choices":["−2","12","2","0"],"answer":2,"exp":"7 に −5 の補数 11111011 を加えると、あふれた桁上がりを除いて 00000010 となり、値は 2 である。"}]},{"id":"3-03","title":"浮動小数点","questions":[{"q":"浮動小数点数の内部表現を構成する要素の組合せとして正しいものはどれか。","choices":["整数部と小数部","基数と指数部","符号部、指数部、仮数部","仮数部と小数部"],"answer":2,"exp":"浮動小数点数は、数の符号を表す符号部、桁の位置を表す指数部、有効数字を表す仮数部から構成される。"},{"q":"2進数 0.00101 を、仮数部が 1.××× の形になるよう正規化したものはどれか。","choices":["1.01×2^−2","1.01×2^−4","1.01×2^3","1.01×2^−3"],"answer":3,"exp":"小数点を右へ3桁移動して仮数部を 1.01 にするので、指数は −3 となり、1.01×2^−3 と表される。"},{"q":"IEEE 754 の単精度（32ビット）浮動小数点数のビット配分として正しいものはどれか。","choices":["符号1ビット、指数8ビット、仮数23ビット","符号1ビット、指数7ビット、仮数24ビット","符号2ビット、指数8ビット、仮数22ビット","符号1ビット、指数11ビット、仮数20ビット"],"answer":0,"exp":"単精度では符号1ビット、指数8ビット、仮数23ビットの合計32ビットで表す。"},{"q":"10進数 5.75 を2進数に変換し、仮数部が 1.××× の形になるよう正規化したものはどれか。","choices":["1.0111×2^1","1.0111×2^2","1.1110×2^2","1.0111×2^3"],"answer":1,"exp":"5.75 は2進数で 101.11 となり、小数点を左へ2桁移動して正規化すると 1.0111×2^2 になる。"}]},{"id":"3-04","title":"誤差","questions":[{"q":"桁落ちの説明として正しいものはどれか。","choices":["大きな数と小さな数の加算で小さな数が消える現象","有限桁への丸めによって生じる誤差","測定器の性能限界によって生じる誤差","絶対値のほぼ等しい2数の減算で、有効桁数が著しく減少する現象"],"answer":3,"exp":"桁落ちは、ほぼ等しい数同士の引き算で上位の桁が打ち消し合い、有効桁数が大幅に減る現象である。"},{"q":"情報落ち（吸収）が発生する計算の例はどれか。","choices":["1.2345 − 1.2344 の計算","桁差の大きい 123456 ＋ 0.00123 のような加算","10進数 0.1 を2進数に変換する計算","有効桁数を超えた部分を四捨五入する計算"],"answer":1,"exp":"情報落ちは、絶対値の差が大きい数同士の加減算で、小さい数の情報が桁合わせの際に失われる現象である。"},{"q":"丸め誤差が生じる主な原因はどれか。","choices":["近い数同士の減算を行うこと","桁差の大きい加算を行うこと","数を有限の桁数で表すために、切捨てや四捨五入を行うこと","入力データに測定ミスがあること"],"answer":2,"exp":"コンピュータでは数を有限の桁数で表すしかないため、収まりきらない部分を丸めることで誤差が生じる。"},{"q":"真値が 2.00、測定値が 2.02 のとき、絶対誤差と相対誤差の組合せとして正しいものはどれか。","choices":["絶対誤差 0.02、相対誤差 1%","絶対誤差 0.02、相対誤差 2%","絶対誤差 1%、相対誤差 0.02","絶対誤差 0.01、相対誤差 1%"],"answer":0,"exp":"絶対誤差は測定値と真値の差で 0.02、相対誤差は絶対誤差を真値で割った 0.02÷2.00＝1% である。"}]},{"id":"3-05","title":"シフト演算","questions":[{"q":"8ビットの値 00101100 を左へ1ビット論理シフトした結果はどれか。","choices":["01011001","01011000","00010110","01011010"],"answer":1,"exp":"左へ1ビット論理シフトすると各ビットが左へ移動し、空いた最下位には0が入るので 01011000（値は44から88へ2倍）になる。"},{"q":"8ビットの値 10110000 を右へ2ビット論理シフトした結果はどれか。","choices":["11101100","00101101","00101100","01011000"],"answer":2,"exp":"論理シフトでは空いた上位ビットに0が入るので、右へ2ビットで 00101100 になる。"},{"q":"符号付き8ビットの値 11110000（−16）を右へ1ビット算術シフトした結果はどれか。","choices":["01111000（120）","11110111（−9）","11110000（−16）","11111000（−8）"],"answer":3,"exp":"算術シフトでは符号ビットと同じ1が上位に補充されるので 11111000 となり、値は −8（半分）になる。"},{"q":"符号なし8ビットの値 00010110（22）を左へ2ビット論理シフトした結果と値の変化の組合せとして正しいものはどれか。","choices":["01011000 となり、値は4倍の 88 になる","01011000 となり、値は2倍の 44 になる","01011010 となり、値は 88 になる","00101100 となり、値は 44 になる"],"answer":0,"exp":"左へ2ビットシフトすると 01011000 になり、値は 2^2＝4 倍の 88 になる（あふれがない場合）。"}]},{"id":"3-06","title":"論理演算","questions":[{"q":"ビット列 1011 と 1101 の論理積（AND）はどれか。","choices":["1111","0111","1001","1011"],"answer":2,"exp":"ANDは両方とも1の桁だけが1になるので、1011 と 1101 では 1001 になる。"},{"q":"ビット列 1011 と 0100 の論理和（OR）はどれか。","choices":["1111","1011","0100","1101"],"answer":0,"exp":"ORはどちらか一方が1の桁が1になるので、1011 と 0100 では 1111 になる。"},{"q":"ビット列 1011 と 1111 の排他的論理和（XOR）はどれか。","choices":["1011","0100","1111","0000"],"answer":1,"exp":"XORは両者が異なる桁だけが1になるので、1011 と 1111 では 0100 になる。"},{"q":"ビット列 1100 と 1010 の否定論理積（NAND）を4ビットで求めたものはどれか。","choices":["1000","1110","0110","0111"],"answer":3,"exp":"AND は 1000 で、そのビットを反転した NAND は 0111 になる。"}]},{"id":"3-07","title":"半加算器と全加算器","questions":[{"q":"半加算器の出力である和 S と桁上がり C の組合せとして正しいものはどれか。ここで A、B は入力とする。","choices":["S＝A XOR B、C＝A AND B","S＝A AND B、C＝A XOR B","S＝A OR B、C＝A XOR B","S＝A XOR B、C＝A OR B"],"answer":0,"exp":"半加算器の和は排他的論理和、桁上がりは論理積で得られる。"},{"q":"全加算器が半加算器と異なる点はどれか。","choices":["和を2ビットで出力すること","桁上がりを出力しないこと","入力が2つであること","下位桁からの桁上がりも入力として加算すること"],"answer":3,"exp":"全加算器は A、B の2入力に加えて下位桁からの桁上がりを入力し、合計3入力の加算を行う。"},{"q":"半加算器に A＝1、B＝1 を入力したときの出力はどれか。","choices":["S＝1、C＝1","S＝1、C＝0","S＝0、C＝1","S＝0、C＝0"],"answer":2,"exp":"1＋1 は2進数で 10 なので、和 S は 0、桁上がり C は 1 になる。"},{"q":"全加算器を構成する方法として正しいものはどれか。","choices":["半加算器1個とAND回路1個の組合せ","半加算器2個とOR回路1個の組合せ","半加算器2個とNOT回路1個の組合せ","OR回路2個とAND回路1個の組合せ"],"answer":1,"exp":"全加算器は、半加算器2個で A と B の和および下位桁上がりとの和を求め、両方の桁上がりを OR 回路でまとめることで構成できる。"}]},{"id":"3-08","title":"計測と制御","questions":[{"q":"A/D変換の手順として正しい順序はどれか。","choices":["量子化 → 標本化 → 符号化","符号化 → 標本化 → 量子化","標本化 → 符号化 → 量子化","標本化 → 量子化 → 符号化"],"answer":3,"exp":"A/D変換は、連続信号を取り出す標本化、段階値に近似する量子化、ビット列にする符号化の順に行われる。"},{"q":"標本化（サンプリング）の説明として正しいものはどれか。","choices":["信号を有限の段階値に近似すること","信号を0と1の符号列に変換すること","連続信号を一定の時間間隔で取り出して、離散的な値の列にすること","信号の最大値を記録すること"],"answer":2,"exp":"標本化は、アナログの連続信号を一定間隔ごとに取り出して離散化する処理である。"},{"q":"フィードバック制御の例として適切なものはどれか。","choices":["洗濯機が決められた手順で洗い・すすぎ・脱水を行う","室温を測定し、目標温度との差に応じてエアコンの出力を調整する","信号機が一定時間ごとに切り替わる","エレベータが押されたボタンの階へ移動する"],"answer":1,"exp":"フィードバック制御は、出力（室温）を検出して目標値と比較し、その差に基づいて操作量を調整する制御である。"},{"q":"量子化の説明として正しいものはどれか。","choices":["標本化した値を、あらかじめ定めた有限個の段階値のうち最も近い値に置き換えること","一定間隔で信号を取り出すこと","アナログ値をそのままの形で記録すること","符号化したデータを圧縮すること"],"answer":0,"exp":"量子化は、標本化で得た値を有限の段階で表すために、最も近い段階値へ近似する処理である。"}]},{"id":"3-09","title":"オートマトン","questions":[{"q":"有限オートマトンの構成要素に含まれないものはどれか。","choices":["状態の集合","無限の長さのテープ","初期状態","状態遷移を定める規則"],"answer":1,"exp":"有限オートマトンは状態・入力記号・遷移規則・初期状態・受理状態から構成され、無限テープはチューリングマシンの要素である。"},{"q":"状態 A、B からなるオートマトンがあり、A では入力 0 で A へ、1 で B へ遷移し、B では入力 0 で A へ、1 で B へ遷移する。初期状態 A に文字列 101 を入力した後の状態はどれか。","choices":["A","A でも B でもない状態","遷移できない","B"],"answer":3,"exp":"A から 1 で B、0 で A、1 で B と遷移するので、最終状態は B である。"},{"q":"状態 q0、q1、q2 からなるオートマトンがあり、q0 では入力 0 で q1 へ、1 で q0 へ遷移し、q1 では入力 0 で q1 へ、1 で q2 へ遷移する。初期状態 q0 に文字列 001 を入力した後の状態はどれか。","choices":["q2","q0","q1","遷移できない"],"answer":0,"exp":"q0 から 0 で q1、0 で q1、1 で q2 と遷移するので、最終状態は q2 である。"},{"q":"プッシュダウンオートマトンの説明として正しいものはどれか。","choices":["状態を持たない機械である","入力を読んで状態遷移するだけの機械である","スタックを備え、対応の取れた括弧列のような文字列を認識できる","有限オートマトンと全く同じ文字列の集合しか認識できない"],"answer":2,"exp":"プッシュダウンオートマトンは有限オートマトンにスタックを加えたもので、入れ子構造をもつ文字列も認識できる。"}]},{"id":"3-10","title":"AI","questions":[{"q":"教師あり学習の説明として正しいものはどれか。","choices":["ラベルのないデータから構造を見つけ出す学習","報酬を最大化するように試行錯誤する学習","入力と正解ラベルの組を与えて学習する方法","データを圧縮して特徴を抽出する学習"],"answer":2,"exp":"教師あり学習は、入力データとそれに対応する正解（ラベル）の組を学習データとしてモデルを訓練する方法である。"},{"q":"教師あり学習における「分類」タスクの例はどれか。","choices":["明日の株価の数値を予測する","メールがスパムかどうかを判定する","顧客を似た者同士のグループに分ける","画像のノイズを除去する"],"answer":1,"exp":"スパムかどうかという離散的なカテゴリを判定するタスクは分類であり、数値予測は回帰、グループ分けは教師なし学習のクラスタリングである。"},{"q":"過学習の説明として正しいものはどれか。","choices":["学習データが少なすぎて学習が全く進まない状態","モデルの層が深すぎる状態","学習が途中で停止してしまう現象","訓練データに適合しすぎて、未知のデータに対する精度が低下する状態"],"answer":3,"exp":"過学習は、モデルが訓練データの細部まで覚えてしまうことで汎化性能が下がる現象である。"},{"q":"教師なし学習の手法の例はどれか。","choices":["クラスタリング","線形回帰","決定木による分類","ロジスティック回帰"],"answer":0,"exp":"クラスタリングは正解ラベルを使わずにデータをグループ分けする教師なし学習の代表的な手法である。"}]},{"id":"3-11","title":"線形代数","questions":[{"q":"行列 A＝[[1, 2], [3, 4]]、B＝[[2, 0], [1, 3]] の積 AB はどれか。","choices":["[[4, 6], [10, 12]]","[[4, 0], [3, 12]]","[[2, 6], [10, 12]]","[[4, 6], [10, 10]]"],"answer":0,"exp":"AB の各成分は A の行と B の列の内積で、(1×2＋2×1, 1×0＋2×3; 3×2＋4×1, 3×0＋4×3)＝[[4, 6], [10, 12]] になる。"},{"q":"2行2列行列 [[3, 1], [2, 4]] の行列式はどれか。","choices":["14","6","10","12"],"answer":2,"exp":"行列式は 3×4 − 1×2 ＝ 12 − 2 ＝ 10 である。"},{"q":"ベクトル (1, 2, 3) と (4, 0, −1) の内積はどれか。","choices":["3","1","7","−1"],"answer":1,"exp":"内積は対応する成分の積の和で、1×4 ＋ 2×0 ＋ 3×(−1) ＝ 4 − 3 ＝ 1 である。"},{"q":"行列 [[2, 4], [3, 6]] について正しいものはどれか。","choices":["行列式は 12 である","逆行列が存在する","単位行列である","行列式が 0 なので逆行列は存在しない"],"answer":3,"exp":"行列式は 2×6 − 4×3 ＝ 0 であり、行列式が 0 の行列には逆行列が存在しない。"}]},{"id":"3-12","title":"確率・統計","questions":[{"q":"サイコロを2個同時に投げるとき、出た目の和が 7 になる確率はどれか。","choices":["7/36","5/36","1/7","1/6"],"answer":3,"exp":"目の組合せは36通りで、和が7になるのは (1,6) (2,5) (3,4) (4,3) (5,2) (6,1) の6通りなので、確率は 6/36＝1/6 である。"},{"q":"コインを3枚同時に投げるとき、表がちょうど2枚出る確率はどれか。","choices":["3/8","1/4","1/2","5/8"],"answer":0,"exp":"全事象は 2^3＝8 通りで、表が2枚になるのは3通りなので、確率は 3/8 である。"},{"q":"データ 2, 4, 6 の分散はどれか。","choices":["2","4","8/3","3"],"answer":2,"exp":"平均は 4 で、各データと平均の差の2乗は 4, 0, 4 なので、分散は (4＋0＋4)÷3＝8/3 である。"},{"q":"赤玉3個、白玉2個が入った袋から玉を1個ずつ2回取り出す（取り出した玉は戻さない）とき、2回とも赤玉である確率はどれか。","choices":["9/25","3/10","3/5","1/2"],"answer":1,"exp":"1回目に赤を引く確率は 3/5、残り4個から2回目に赤を引く確率は 2/4 なので、積は 3/5×2/4＝3/10 である。"}]},{"id":"4-01","questions":[{"answer":3,"choices":["端子","処理","判断","ループ端"],"exp":"繰返しの範囲を示す記号はループ端であり、開始側と終了側を対にして使う。判断は条件分岐を示すひし形である。","q":"フローチャートで、繰返しの開始と終了を示すために使う記号はどれか。"},{"answer":1,"choices":["無限に処理が続いてもよい","有限回の手順で必ず終了する","実行のたびに結果が変わってもよい","手順が曖昧でもよい"],"exp":"アルゴリズムは有限性が求められ、有限回の手順で必ず終了しなければならない。各手順が明確であることも必要である。","q":"アルゴリズムが満たすべき性質として、正しいものはどれか。"},{"answer":0,"choices":["プログラム言語に近い形で、厳密に記述できる","自然言語よりも曖昧に記述できる","記述しただけでプログラムの実行速度が上がる","プログラム言語への翻訳が一切不要になる"],"exp":"疑似言語は特定のプログラム言語に依存せず、プログラムに近い厳密さで処理手順を表せる。実行するには実際の言語への変換が必要である。","q":"疑似言語を用いてアルゴリズムを記述する利点として、適切なものはどれか。"},{"answer":2,"choices":["順次・繰返し・代入","分岐・代入・繰返し","順次・分岐・繰返し","代入・分岐・繰返し"],"exp":"基本制御構造は、順次、選択（分岐）、繰返しの3つであり、あらゆる処理はこの組合せで表せる。代入は処理の一種であって制御構造ではない。","q":"プログラムの基本的な制御構造の組合せとして、正しいものはどれか。"}],"title":"アルゴリズム"},{"id":"4-02","questions":[{"answer":1,"choices":["要素ごとに異なるデータ型を混在させる構造である","添字を使って任意の要素に直接アクセスできる","要素同士をポインタでつないで格納する","要素の個数は格納のたびに自動で決まる"],"exp":"配列は同じデータ型の要素を並べて格納し、添字を指定することで任意の要素へ直接アクセスできる。","q":"配列の特徴として、正しいものはどれか。"},{"answer":2,"choices":["12","13","14","15"],"exp":"sum には 3+1+4+1+5 が順に加算されるので、最終的な値は14になる。","q":"次の疑似言語の処理を実行したとき、変数 sum の値はいくつになるか。\n配列 a の要素は a[0]=3, a[1]=1, a[2]=4, a[3]=1, a[4]=5 である。\nsum ← 0\ni を 0 から 4 まで 1 ずつ増やしながら繰り返す\n  sum ← sum + a[i]\n繰返し終わり"},{"answer":0,"choices":["3","2","4","5"],"exp":"偶数は 2、4、6 の3個なので、cnt は3回加算されて3になる。","q":"次の疑似言語の処理を実行したとき、変数 cnt の値はいくつになるか。\n配列 a の要素は a[0]=2, a[1]=7, a[2]=4, a[3]=9, a[4]=6 である。\ncnt ← 0\ni を 0 から 4 まで 1 ずつ増やしながら繰り返す\n  もし a[i] を 2 で割った余りが 0 ならば\n    cnt ← cnt + 1\n  である\n繰返し終わり"},{"answer":3,"choices":["要素同士をポインタで連結した構造である","添字を1つだけ使って要素を指定する","行ごとに異なるデータ型の要素を格納できる","行と列の2つの添字で要素を指定する"],"exp":"2次元配列は表のように行と列で位置が決まり、2つの添字を指定して要素を参照する。","q":"2次元配列の説明として、正しいものはどれか。"}],"title":"配列"},{"id":"4-03","questions":[{"answer":0,"choices":["各要素が次の要素へのポインタ（参照）を持ち、要素同士がつながっている","全ての要素が連続した領域に、隙間なく格納されている","要素が親と子の関係で階層的につながっている","先に入れた要素から順にしか参照できない"],"exp":"連結リストは、各要素がデータと次の要素へのポインタを持ち、それをたどることで要素を参照する構造である。","q":"連結リスト（線形リスト）の構造として、正しいものはどれか。"},{"answer":2,"choices":["任意の要素へ添字で直接アクセスできる","要素の格納にポインタが不要である","要素の挿入や削除の際に、後続の要素を移動させる必要がない","メモリ使用量が必ず配列より少なくなる"],"exp":"連結リストの挿入・削除はポインタの付け替えだけで済み、配列のように後続要素をずらす必要がない。","q":"配列と比較したときの、連結リストの利点はどれか。"},{"answer":3,"choices":["要素の挿入が一切できない","要素の削除が一切できない","先頭の要素しか参照できない","途中の要素を参照するには、先頭から順にポインタをたどる必要がある"],"exp":"連結リストには添字による直接アクセスがなく、目的の要素までは先頭から順にたどるため、参照に時間がかかる。","q":"連結リストの欠点として、適切なものはどれか。"},{"answer":1,"choices":["要素が2個ずつ組になって格納される","各要素が次の要素と前の要素の両方へのポインタを持つ","データが2方向に整列されている","ポインタを持たない要素の集まりである"],"exp":"双方向リストは各要素が前方向と後方向のポインタを持つため、どちらの向きにもたどることができる。","q":"双方向リストの説明として、正しいものはどれか。"}],"title":"連結リスト"},{"id":"4-04","questions":[{"answer":2,"choices":["先入れ先出しである","要素を任意の位置から取り出せる","後入れ先出しである","格納した順に取り出す"],"exp":"スタックは最後に格納したデータから取り出す、後入れ先出し（LIFO）の構造である。","q":"スタックのデータの出し入れの方式として、正しいものはどれか。"},{"answer":0,"choices":["先入れ先出しである","後入れ先出しである","大きな値から順に取り出す","要素を任意の位置から取り出せる"],"exp":"キューは最初に格納したデータから取り出す、先入れ先出し（FIFO）の構造であり、待ち行列の管理などに使われる。","q":"キューのデータの出し入れの方式として、正しいものはどれか。"},{"answer":1,"choices":["3","2","4","1"],"exp":"1回目の pop で3、4を push した後の pop で4、その次の pop で2が取り出されるので、最後は2である。","q":"空のスタックに、1、2、3 の順に push（格納）し、1回 pop（取出し）を行い、次に 4 を push し、さらに 2回 pop を行った。このとき、最後に pop で取り出される値はいくつか。"},{"answer":3,"choices":["プリンタの印刷ジョブの待ち行列の管理","到着順に処理する受付業務の管理","送信待ちメールの順序管理","プログラムにおける関数呼び出しの管理"],"exp":"関数の呼び出しでは、呼び出した順と逆の順に戻る必要があるため、後入れ先出しのスタックで管理される。ほかの選択肢はキューの利用例である。","q":"スタックが利用される例として、適切なものはどれか。"}],"title":"キューとスタック"},{"id":"4-05","questions":[{"answer":1,"choices":["子を持たない節点のことである","親を持たない最上位の節点のことである","節点同士を結ぶ枝のことである","木の末端にある全ての節点の総称である"],"exp":"根は木構造の最上位に位置する、親を持たない唯一の節点である。子を持たない節点は葉と呼ばれる。","q":"木構造における「根（ルート）」の説明として、正しいものはどれか。"},{"answer":3,"choices":["根のことである","節点同士を結ぶ枝のことである","親を2つ持つ節点のことである","子を持たない節点のことである"],"exp":"葉は子を持たない末端の節点である。木構造では1つの節点が持つ親は最大で1つである。","q":"木構造における「葉（リーフ）」の説明として、正しいものはどれか。"},{"answer":0,"choices":["15","7","8","16"],"exp":"各階層の節点数は 1、2、4、8 となり、合計は 1+2+4+8=15 である。","q":"根を第1階層とする4階層の二分木で、全ての節点が子を2つ持つとき、節点の総数はいくつか。"},{"answer":2,"choices":["深さの浅い順に得られる","降順に得られる","昇順に得られる","格納した順に得られる"],"exp":"二分探索木は左部分木が小さく右部分木が大きいため、左・節点・右の順にたどる中間順では値が昇順に得られる。","q":"二分探索木を中間順（通りがけ順）にたどったとき、得られる値の並びはどうなるか。"}],"title":"木構造"},{"id":"4-06","questions":[{"answer":3,"choices":["1回","log2 n 回","n 回","(n+1)/2 回"],"exp":"線形探索では目的のデータが先頭から末尾まで均等に存在すると考えられるため、平均比較回数は (n+1)/2 回となる。","q":"n 件のデータを線形探索で探索するとき、目的のデータが見つかるまでの平均比較回数はどれか。"},{"answer":0,"choices":["データが整列されていること","データの件数が偶数であること","データがハッシュ関数で格納されていること","データに重複がないこと"],"exp":"二分探索は中央の値との大小比較で範囲を半分に絞るため、データがあらかじめ整列されている必要がある。","q":"二分探索を行うための前提条件として、必要なものはどれか。"},{"answer":2,"choices":["1回","2回","3回","4回"],"exp":"最初に中央の12と比較し（1回）、次に右半分の中央である23と比較し（2回）、最後に16と比較して見つかる（3回）ため、比較回数は3回である。","q":"整列済みの配列 [2, 5, 8, 12, 16, 23, 38] に対して二分探索で 16 を探索する。中央の要素と比較する手順で進めるとき、16 が見つかるまでの比較回数は何回か。"},{"answer":1,"choices":["異なるデータから同じ格納位置が得られる衝突（シノニム）は、絶対に発生しない","異なるデータから同じ格納位置が得られる衝突（シノニム）が発生することがある","探索の前にデータを整列しておく必要がある","比較回数はデータ件数 n に比例して増える"],"exp":"ハッシュ法では、ハッシュ関数によって異なるデータが同じ格納位置になる衝突（シノニム）が発生することがあり、その対策が必要である。","q":"ハッシュ法による探索の説明として、正しいものはどれか。"}],"title":"データの探索"},{"id":"4-07","questions":[{"answer":1,"choices":["[1, 2, 4, 5]","[2, 4, 1, 5]","[2, 4, 5, 1]","[5, 2, 4, 1]"],"exp":"走査では 5と2、5と4、5と1 が順に交換され、最大値の5が右端へ移動して [2, 4, 1, 5] となる。","q":"配列 [5, 2, 4, 1] を昇順に整列するため、バブルソート（隣接交換法）で左から右へ隣同士を比較・交換する走査を1回行った。走査後の配列はどれか。"},{"answer":3,"choices":["隣り合う要素を比較し、逆順なら交換することを繰り返す","基準値を決め、それより小さい要素と大きい要素に分割することを繰り返す","整列済みの部分に、要素を適切な位置へ挿入していく","未整列の部分から最小値を選び、未整列部分の先頭の要素と交換する"],"exp":"選択ソートは、未整列部分の中から最小値を選んで先頭と交換し、整列済みの範囲を広げていく方法である。","q":"選択ソート（単純選択法）の手順として、正しいものはどれか。"},{"q":"挿入ソート（単純挿入法）の説明として、適切なものはどれか。","choices":["未整列の部分から取り出した要素を、整列済みの部分の適切な位置に差し込む","未整列の部分の最大値を選んで、末尾に置く","隣り合う要素を比較し、順序が逆なら交換する","基準となる要素を決めて、それより大きい要素と小さい要素に分ける"],"answer":0,"exp":"挿入ソートは、整列済みの部分に対して、新しい要素を適切な位置へ挿入していく方法である。最大値を選ぶのは選択ソート、隣同士の交換はバブルソート、基準値で分けるのはクイックソートの考え方である。"},{"answer":2,"choices":["選択ソート","ヒープソート","バブルソート","クイックソート"],"exp":"バブルソートは隣同士の比較で、等しい要素を交換しないため安定である。選択ソート、ヒープソート、クイックソートは一般に安定ではない。","q":"同じ値の要素の順序が、整列後も元の順序のまま保たれる「安定なソート」はどれか。"}],"title":"データの整列"},{"id":"4-08","questions":[{"q":"データ量が n のとき、処理時間が n の2乗に比例するアルゴリズムがある。n＝100 のとき処理時間が2秒であった。n＝300 のときの処理時間は何秒か。","choices":["6秒","12秒","18秒","54秒"],"answer":2,"exp":"処理時間は n の2乗に比例する。n が3倍になると処理時間は9倍になるので、2×9＝18秒である。"},{"answer":2,"choices":["O(1)","O(log n)","O(n)","O(n^2)"],"exp":"線形探索は先頭から順に比較し、最悪で n 回の比較が必要になるため、計算量は O(n) である。","q":"線形探索の計算量を表すオーダーはどれか。"},{"q":"未知数の個数が n のとき、演算回数が n の3乗に比例するアルゴリズムがある。n＝10 のとき1秒で処理できた計算を、n＝20 で行うと何秒かかるか。演算速度は同じとする。","choices":["2秒","4秒","8秒","16秒"],"answer":2,"exp":"演算回数は n の3乗に比例する。n が2倍になると演算回数は8倍になるので、処理時間も8秒になる。"},{"q":"データ量 n が十分に大きいとき、計算量の小さい順として、正しいものはどれか。","choices":["O(1) ＜ O(n) ＜ O(n log n) ＜ O(n^2)","O(n) ＜ O(1) ＜ O(n^2) ＜ O(n log n)","O(1) ＜ O(n log n) ＜ O(n) ＜ O(n^2)","O(n log n) ＜ O(1) ＜ O(n) ＜ O(n^2)"],"answer":0,"exp":"計算量は、定数、線形、線形対数、2乗の順に大きくなる。O(1)＜O(n)＜O(n log n)＜O(n^2) が正しい。"}],"title":"アルゴリズムの計算量"},{"id":"4-09","questions":[{"answer":2,"choices":["再配置可能（リロケータブル）","再帰的（リカーシブ）","再入可能（リエントラント）","再使用可能（リユーザブル）"],"exp":"再入可能とは、実行中のプログラムが中断され、再度呼び出されても正しく動作する性質である。","q":"複数のタスクから同時に呼び出されても、それぞれ正しく動作するプログラムの性質はどれか。"},{"answer":0,"choices":["再配置可能（リロケータブル）","再入可能（リエントラント）","再帰的（リカーシブ）","再使用可能（リユーザブル）"],"exp":"再配置可能とは、プログラムを主記憶の任意の位置に配置しても実行できる性質である。","q":"主記憶上のどの位置に配置されても、正しく実行できるプログラムの性質はどれか。"},{"answer":3,"choices":["再使用可能（リユーザブル）","再配置可能（リロケータブル）","再入可能（リエントラント）","再帰的（リカーシブ）"],"exp":"再帰的とは、プログラムが自分自身を呼び出すことができる性質であり、階乗計算などに利用される。","q":"プログラムが自分自身を呼び出すことができる性質はどれか。"},{"answer":1,"choices":["再帰的（リカーシブ）","再入可能（リエントラント）","再配置可能（リロケータブル）","再使用可能（リユーザブル）"],"exp":"実行中のルーチンが再度入り込んで使われても正しく動く性質が再入可能であり、割り込み処理などで必要となる。","q":"実行中のルーチンが割り込みによって中断され、その処理の中で同じルーチンが再度呼び出されても正しく動作するとき、このルーチンが備えている性質はどれか。"}],"title":"プログラムの性質"},{"id":"4-10","questions":[{"answer":1,"choices":["プログラムを1文ずつ翻訳しながら実行する","プログラム全体を機械語に翻訳してから実行する","ソースプログラムをそのままCPUが実行する","翻訳を行わずに実行する"],"exp":"コンパイラはソースプログラム全体を機械語のプログラムに翻訳してから実行するため、一般に実行速度が速くなる。","q":"コンパイラ方式の説明として、正しいものはどれか。"},{"answer":3,"choices":["プログラム全体を事前に機械語へ翻訳しておく方式である","翻訳結果のファイルを保存してから実行する方式である","機械語のプログラムだけを対象とする方式である","プログラムを1文ずつ翻訳しながら実行する方式である"],"exp":"インタプリタはソースプログラムを1文ずつ翻訳しながら実行する方式であり、実行しながら動作を確認できる。","q":"インタプリタ方式の説明として、正しいものはどれか。"},{"answer":0,"choices":["マークアップ言語であり、タグを使って文書の構造や見栄えを記述する","機械語を記号で表した低水準言語である","コンパイラによって機械語に翻訳されるプログラム言語である","OSの一種である"],"exp":"HTMLはマークアップ言語であり、タグで文書の見出しや段落などの構造を記述し、Webページの表示に使われる。","q":"HTMLの説明として、正しいものはどれか。"},{"answer":2,"choices":["ソースプログラムをCPUが直接実行する","機械語に翻訳され、仮想マシンは使われない","バイトコードに変換され、仮想マシン（JVM）上で実行される","マークアップ言語としてブラウザが解釈する"],"exp":"Javaはソースをバイトコードにコンパイルし、それを仮想マシンが解釈して実行するため、異なる環境でも同じプログラムが動作する。","q":"Javaプログラムの実行方式として、正しいものはどれか。"}],"title":"プログラム言語とマークアップ言語"},{"id":"5-01","title":"システム構成","questions":[{"q":"データが発生した時点で即座に処理を行い、結果を返す処理形態はどれか。","choices":["バッチ処理","リアルタイム処理","タイムシェアリング処理","オフライン処理"],"answer":1,"exp":"リアルタイム処理は、データの発生と同時に処理を行い、即時に結果を返す処理形態である。"},{"q":"事業継続計画（BCP）の説明として、適切なものはどれか。","choices":["災害や障害が発生したときに、重要な事業を継続し、早期に復旧するための計画","情報システムの開発工程を標準化するための計画","従業員の勤務時間と休暇を管理するための計画","新しい製品の販売戦略を定めた計画"],"answer":0,"exp":"BCP（事業継続計画）は、災害や大規模障害の発生時に重要な事業を中断させず、目標とする時間内に復旧させるための計画である。"},{"q":"ミッションクリティカルシステムの説明として、適切なものはどれか。","choices":["停止すると社会や企業活動に致命的な影響を与えるため、極めて高い信頼性が求められるシステム","開発コストを最小に抑えることを最優先したシステム","試験運用だけを目的とした小規模なシステム","停止しても業務への影響がほとんどないシステム"],"answer":0,"exp":"ミッションクリティカルシステムは、障害による停止が致命的な影響を及ぼすシステムであり、高い信頼性と可用性が求められる。"},{"q":"バッチ処理の特徴として、適切なものはどれか。","choices":["データ発生の都度、即座に処理する","利用者と対話しながら処理する","処理の優先順位を動的に制御する","一定量又は一定期間のデータを集めて一括して処理する"],"answer":3,"exp":"バッチ処理は、データを一定量又は一定期間分まとめて一括処理する形態で、給与計算などに用いられる。"}]},{"id":"5-02","title":"クライアントサーバシステム","questions":[{"q":"3層クライアントサーバシステムにおいて、データベースへのアクセスやデータ管理を担当する層はどれか。","choices":["プレゼンテーション層","ファンクション層","データ層","トランスポート層"],"answer":2,"exp":"3層構造はプレゼンテーション層、ファンクション層、データ層からなり、データ管理はデータ層が担当する。"},{"q":"シンクライアントの特徴として、適切なものはどれか。","choices":["クライアント側は入出力などの最小限の機能だけを持ち、処理はサーバ側で行う","クライアント側にすべてのアプリケーションとデータを保持する","サーバを必要としない構成である","クライアント同士が対等にデータを共有する"],"answer":0,"exp":"シンクライアントは、処理やデータをサーバ側に集中させ、クライアント側の機能を最小限にする方式である。"},{"q":"ストアドプロシージャを利用する利点として、適切なものはどれか。","choices":["データの正規化が自動的に行われる","主キーの設定が不要になる","データベースのバックアップが不要になる","クライアントとサーバ間の通信量を削減できる"],"answer":3,"exp":"ストアドプロシージャは処理手順をDBサーバ側に格納して実行するため、SQL文のやり取りが減り、通信量を削減できる。"},{"q":"クライアントサーバシステムにおけるサーバの役割として、適切なものはどれか。","choices":["画面表示だけを担当する","データや処理を一元管理し、クライアントからの要求に応じてサービスを提供する","クライアントの電源管理を行う","ネットワークの物理的な接続だけを行う"],"answer":1,"exp":"サーバはデータやアプリケーションを一元管理し、複数のクライアントからの要求に応じてサービスを提供する。"}]},{"id":"5-03","title":"RAIDと信頼性設計","questions":[{"q":"RAID 0（ストライピング）の特徴として、適切なものはどれか。","choices":["同じデータを複数のディスクに複製して信頼性を高める","パリティ情報を用いて障害時にデータを復旧できる","データを複数のディスクに分散して書き込み、読み書きを高速化するが冗長性はない","最低3台のディスクが必要である"],"answer":2,"exp":"RAID 0はデータを複数ディスクに分散記録して高速化するが、冗長性がないため耐障害性は向上しない。"},{"q":"RAID 1の説明として、適切なものはどれか。","choices":["同じデータを2台のディスクに書き込むミラーリングによって信頼性を高める","データを分散して書き込み高速化だけを図る","パリティを専用ディスクに記録する","データをテープ装置へ複製する"],"answer":0,"exp":"RAID 1はミラーリングによって同じデータを複数ディスクに保持し、1台が故障しても運用を継続できる。"},{"q":"RAID 5の特徴として、適切なものはどれか。","choices":["ディスクは2台だけで構成できる","データとパリティを複数のディスクに分散して記録し、1台の故障時にはデータを復旧できる","冗長性がないので高速化だけを目的とする","書き込みが一切できない"],"answer":1,"exp":"RAID 5はパリティを分散して記録するため最低3台が必要で、1台の故障までならデータを復旧できる。"},{"q":"システムに故障が発生しても、安全な状態に移行するように設計する考え方はどれか。","choices":["フールプルーフ","フォールトトレランス","フェールソフト","フェールセーフ"],"answer":3,"exp":"フェールセーフは故障時に安全側に倒れるよう設計する考え方である。フェールソフトは機能を低下させながら運転を継続する考え方である。"}]},{"id":"5-04","title":"システムの性能評価","questions":[{"q":"システムが単位時間当たりに処理できる仕事の量を表す指標はどれか。","choices":["レスポンスタイム","スループット","ターンアラウンドタイム","稼働率"],"answer":1,"exp":"スループットは単位時間当たりの処理量を表す性能指標である。"},{"q":"利用者が入力を完了してから、出力が開始されるまでの時間を表すものはどれか。","choices":["ターンアラウンドタイム","オーバーヘッド","レスポンスタイム","スループット"],"answer":2,"exp":"レスポンスタイムは入力完了から出力開始までの時間である。ターンアラウンドタイムは入力開始から出力完了までの時間を指す。"},{"q":"標準的なプログラムを実行させて、その処理時間などからコンピュータの性能を測定・比較する方法はどれか。","choices":["ベンチマーク","シミュレーション","モニタリング","プロトタイピング"],"answer":0,"exp":"ベンチマークは、標準的なプログラムの実行結果によってシステムの性能を比較・評価する方法である。"},{"q":"1件のトランザクションの処理に平均0.05秒を要するシステムがある。1時間に処理できるトランザクション件数はどれか。","choices":["720件","7,200件","18,000件","72,000件"],"answer":3,"exp":"1時間は3,600秒なので、3,600 ÷ 0.05 = 72,000件となる。"}]},{"id":"5-05","title":"システムの信頼性評価","questions":[{"q":"MTBFを平均故障間隔、MTTRを平均修復時間とするとき、稼働率を表す式はどれか。","choices":["MTBF ÷（MTBF ＋ MTTR）","MTTR ÷（MTBF ＋ MTTR）","MTBF ÷ MTTR","（MTBF ＋ MTTR）÷ MTBF"],"answer":0,"exp":"稼働率は MTBF ÷（MTBF ＋ MTTR）で求められる。"},{"q":"稼働率0.9の装置と稼働率0.8の装置を直列に接続したシステム全体の稼働率はどれか。","choices":["0.98","0.85","0.72","0.17"],"answer":2,"exp":"直列接続の稼働率は各装置の稼働率の積であり、0.9 × 0.8 = 0.72となる。"},{"q":"稼働率0.9の装置2台を並列に接続したシステム全体の稼働率はどれか。","choices":["0.81","0.99","0.90","1.80"],"answer":1,"exp":"並列接続の稼働率は 1 −（1 − 0.9）×（1 − 0.9）= 1 − 0.01 = 0.99となる。"},{"q":"MTBFが990時間、MTTRが10時間のシステムの稼働率はどれか。","choices":["0.90","0.98","0.989","0.99"],"answer":3,"exp":"稼働率 = 990 ÷（990 ＋ 10）= 990 ÷ 1,000 = 0.99となる。"}]},{"id":"6-01","title":"データベース","questions":[{"q":"関係データベースの特徴として、適切なものはどれか。","choices":["データを木構造で表現する","データを表（テーブル）の形式で表現し、行と列で管理する","データをグラフ構造で表現する","キーと値の組だけでデータを表現する"],"answer":1,"exp":"関係データベースはデータを2次元の表で表現し、表同士を共通の列の値で関連付ける。"},{"q":"階層型データベースの特徴として、適切なものはどれか。","choices":["データを親と子の木構造で表現し、親レコードに対して複数の子レコードを関連付ける","データを2次元の表で表現し、表同士を列の値で関連付ける","データをキーと値の組だけで表現する","データを文書の形でそのまま格納する"],"answer":0,"exp":"階層型データベースは、データを木構造で表現するデータベースである。2次元の表で表現するのは関係データベースである。"},{"q":"外部キーの役割として、適切なものはどれか。","choices":["別の表などのキーを参照し、データ間の参照整合性を保つ","表の検索速度を向上させる","データの暗号化を行う","行の並び順を決める"],"answer":0,"exp":"外部キーは、別の表などの主キーや一意性が保証されたキーを参照する列であり、表間などの参照整合性を保つために用いられる。"},{"q":"3層スキーマ構造において、利用者ごとに必要なデータの見方を定義するスキーマはどれか。","choices":["内部スキーマ","概念スキーマ","物理スキーマ","外部スキーマ"],"answer":3,"exp":"外部スキーマは個々の利用者や応用プログラムから見たデータの構造を定義する。概念スキーマは全体の論理構造、内部スキーマは物理的な格納構造を定義する。"}]},{"id":"6-02","title":"データベース設計","questions":[{"q":"E-R図の説明として、適切なものはどれか。","choices":["対象世界のデータを実体（エンティティ）と実体間の関連（リレーションシップ）で表現する図である","処理の手順を流れで表現する図である","プログラムのモジュール構成を表現する図である","ネットワークの接続形態を表現する図である"],"answer":0,"exp":"E-R図は概念設計で用いられ、エンティティとリレーションシップによってデータの構造を表す。"},{"q":"データベース設計の一般的な手順として、適切なものはどれか。","choices":["物理設計 → 論理設計 → 概念設計","概念設計 → 論理設計 → 物理設計","論理設計 → 物理設計 → 概念設計","概念設計 → 物理設計 → 論理設計"],"answer":1,"exp":"設計は、要件を整理する概念設計、表の構造を決める論理設計、格納方法を決める物理設計の順に進める。"},{"q":"表に設定する主キー制約の条件として、適切なものはどれか。","choices":["主キーの列には同じ値を重複して設定できる","主キーの列にはNULL値を設定できる","主キーの値によって行を一意に識別でき、NULL値は許されない","主キーは数値型の列にだけ設定できる"],"answer":2,"exp":"主キー制約は、行を一意に識別できること（一意性）と、NULL値が許されないこと（非NULL）を条件とする。"},{"q":"論理設計で行う作業として、適切なものはどれか。","choices":["ディスクの配置方法の決定","インデックスの物理的な作成","バックアップ方式の決定","E-R図をもとにした表の定義や正規化"],"answer":3,"exp":"論理設計では、概念設計の結果をもとに、表の構成や正規化など論理的なデータ構造を設計する。"}]},{"id":"6-03","title":"データの正規化","questions":[{"q":"第1正規形の条件として、適切なものはどれか。","choices":["部分関数従属が存在しないこと","繰返し項目がなく、各属性の値が単一の値（原子値）であること","推移的関数従属が存在しないこと","候補キーが1つだけであること"],"answer":1,"exp":"第1正規形では、繰返し項目を排除し、すべての属性値を単一の値（原子値）にする。"},{"q":"第2正規形の条件として、適切なものはどれか。","choices":["繰返し項目が存在しないこと","推移的関数従属が存在しないこと","主キーの一部に対する部分関数従属が存在しないこと","すべての属性が主キーであること"],"answer":2,"exp":"第2正規形は、第1正規形を満たし、主キーの一部だけに決まる属性（部分関数従属）を取り除いた形である。"},{"q":"第3正規形の条件として、適切なものはどれか。","choices":["主キー以外の属性への推移的関数従属が存在しないこと","繰返し項目が存在しないこと","部分関数従属が存在しないことだけが条件である","外部キーが存在しないこと"],"answer":0,"exp":"第3正規形は、第2正規形を満たし、主キー以外の属性への推移的関数従属を取り除いた形である。"},{"q":"表「社員」の列は（社員番号， 氏名， 部署番号， 部署名）であり、主キーは社員番号である。部署名は部署番号によって一意に決まる。この表について、正しいものはどれか。","choices":["非正規形である","第1正規形までしか満たさない","第3正規形を満たしている","第2正規形は満たすが、部署番号から部署名への推移的関数従属があるため第3正規形は満たさない"],"answer":3,"exp":"主キーが単一列なので部分関数従属はなく第2正規形を満たすが、社員番号 → 部署番号 → 部署名という推移的関数従属があるため、第3正規形ではない。"}]},{"id":"6-04","title":"トランザクション処理","questions":[{"q":"トランザクションのACID特性のうち、原子性（Atomicity）の説明として、適切なものはどれか。","choices":["処理結果が障害後も保持されること","同時に実行しても逐次実行と同じ結果になること","トランザクションの処理は、すべて実行されるか、全く実行されないかのいずれかであること","データの整合性が常に保たれること"],"answer":2,"exp":"原子性は、トランザクションが不可分な単位として扱われ、全処理が完了するか全く行われないことを保証する性質である。"},{"q":"あるトランザクションがデータに専有（排他）ロックをかけている間、他のトランザクションの扱いとして、適切なものはどれか。","choices":["そのデータの読み取りも更新もできない","そのデータの読み取りだけはできる","そのデータの更新だけはできる","共有ロックを取得して読み取りできる"],"answer":0,"exp":"専有ロックがかかっている間、他のトランザクションはそのデータの読み取りも更新もできない。"},{"q":"デッドロックの説明として、適切なものはどれか。","choices":["ロックの待ち行列が長くなり処理速度が低下する状態","複数のトランザクションが互いに相手のロック解除を待ち続け、処理が進まなくなる状態","トランザクションが異常終了してロールバックされる状態","データの不整合が発生した状態"],"answer":1,"exp":"デッドロックは、複数のトランザクションが互いに相手が保持する資源の解放を待ち続けて、処理が進まなくなる状態である。"},{"q":"あるトランザクションがデータに共有ロックをかけている間、他のトランザクションの扱いとして、適切なものはどれか。","choices":["そのデータの読み取りも更新もできない","共有ロックを取得して読み取りはできるが、更新はできない","専有ロックを取得して更新できる","ロックを無視して読み取りも更新もできる"],"answer":1,"exp":"共有ロック同士は両立するため、他のトランザクションも共有ロックを取得して読み取ることができる。ただし、更新に必要な専有ロックは取得できない。"}]},{"id":"6-05","title":"データベースの障害回復","questions":[{"q":"データベースのログ（ジャーナル）ファイルに記録される情報として、適切なものはどれか。","choices":["利用者のログイン履歴だけ","データ更新の前後の内容など、障害回復に必要な情報","画面のレイアウト情報","SQL文の文法エラーだけ"],"answer":1,"exp":"ログファイルには更新前情報と更新後情報が記録され、ロールバックやロールフォワードによる障害回復に用いられる。"},{"q":"媒体障害が発生したとき、バックアップしたデータに対してログの更新後情報を適用し、障害発生直前の状態に復旧する処理はどれか。","choices":["ロールバック","再編成","ロールフォワード","圧縮"],"answer":2,"exp":"ロールフォワードは、バックアップしたデータにログの更新後情報を反映させて、障害直前の状態まで復旧する処理である。"},{"q":"システム障害が発生したとき、障害時点でコミットされていなかったトランザクションについて行う処理として、適切なものはどれか。","choices":["ログの更新前情報を用いて、そのトランザクションの更新を取り消す","そのまま処理を確定させる","バックアップからそのトランザクションだけを削除する","優先度を上げて再実行する"],"answer":0,"exp":"コミットされていないトランザクションは、ログの更新前情報を用いてロールバックし、更新を取り消す。"},{"q":"チェックポイントの説明として、適切なものはどれか。","choices":["バックアップを取得する装置のこと","トランザクションの開始時点のこと","ログファイルを削除する時点のこと","その時点までの更新結果をデータベースに反映させる時点であり、障害回復の処理量を抑えるために設けられる"],"answer":3,"exp":"チェックポイントでは、その時点までの更新結果をデータベースに反映し、回復処理を開始する基準点を記録する。障害発生時にログを先頭から調べる必要がなくなるため、回復処理量を抑えられる。"}]},{"id":"6-06","title":"データ操作とSQL","questions":[{"q":"表「商品」は次のとおりである。\n商品コード 商品名 分類 単価\nA01 りんご 食品 150\nA02 みかん 食品 100\nA03 ノート 文具 200\nA04 えんぴつ 文具 80\nA05 ぶどう 食品 300\n次のSQLを実行したとき、抽出される商品名の組合せはどれか。\nSELECT 商品名 FROM 商品 WHERE 分類 = '食品' AND 単価 >= 150","choices":["りんご と みかん","りんご と ぶどう","ぶどう と ノート","りんご と みかん と ぶどう"],"answer":1,"exp":"分類が食品で単価が150以上の行は、りんご（150）とぶどう（300）の2行である。"},{"q":"表「商品」は次のとおりである。\n商品コード 商品名 分類 単価\nA01 りんご 食品 150\nA02 みかん 食品 100\nA03 ノート 文具 200\nA04 えんぴつ 文具 80\nA05 ぶどう 食品 300\n次のSQLを実行したとき、抽出される商品名の組合せはどれか。\nSELECT 商品名 FROM 商品 WHERE 分類 = '文具' OR 単価 >= 300","choices":["りんご と みかん","ノート と えんぴつ と ぶどう","ぶどう だけ","ノート と ぶどう"],"answer":1,"exp":"OR条件では、どちらか一方を満たす行が抽出される。文具のノートとえんぴつ、単価が300以上のぶどうの3行である。"},{"q":"表「商品」は次のとおりである。\n商品コード 商品名 分類 単価\nA01 りんご 食品 150\nA02 みかん 食品 100\nA03 ノート 文具 200\nA04 えんぴつ 文具 80\nA05 ぶどう 食品 300\n次のSQLを実行したとき、抽出される商品名の組合せはどれか。\nSELECT 商品名 FROM 商品 WHERE NOT 分類 = '食品'","choices":["りんご と みかん と ぶどう","ノート だけ","ノート と えんぴつ","えんぴつ と ぶどう"],"answer":2,"exp":"NOTは条件を否定するため、分類が食品でない行、すなわち文具のノートとえんぴつが抽出される。"},{"q":"ビュー（導出表）の説明として、適切なものはどれか。","choices":["実表から定義によって導き出される仮想的な表で、それ自体はデータを持たない","実表のデータを複製して保持する表である","検索を高速化するために自動的に作られる索引である","削除したデータを一時的に保持する表である"],"answer":0,"exp":"ビューは、実表に対する問合せの定義として格納される仮想的な表であり、利用目的に応じたデータの見せ方を提供する。"}]},{"id":"6-07","title":"SQL（並べ替え・グループ化）","questions":[{"q":"表「社員」は次のとおりである。給与の単位は万円とする。\n社員番号 氏名 部署 給与\nE01 佐藤 営業 30\nE02 鈴木 営業 25\nE03 高橋 開発 40\nE04 田中 開発 35\nE05 伊藤 開発 30\n次のSQLを実行したとき、部署「開発」の平均給与はどれか。\nSELECT 部署, AVG(給与) FROM 社員 GROUP BY 部署","choices":["32.5","35","30","36"],"answer":1,"exp":"開発の平均給与は、（40 ＋ 35 ＋ 30）÷ 3 = 35である。"},{"q":"表「社員」は次のとおりである。給与の単位は万円とする。\n社員番号 氏名 部署 給与\nE01 佐藤 営業 30\nE02 鈴木 営業 25\nE03 高橋 開発 40\nE04 田中 開発 35\nE05 伊藤 開発 30\n次のSQLを実行したとき、最初に表示される氏名はどれか。\nSELECT 氏名 FROM 社員 ORDER BY 給与 ASC","choices":["高橋","鈴木","田中","佐藤"],"answer":1,"exp":"ORDER BY 給与 ASCは給与の昇順に並べ替えるため、最も給与が低い鈴木（25）が最初に表示される。"},{"q":"表「社員」は次のとおりである。給与の単位は万円とする。\n社員番号 氏名 部署 給与\nE01 佐藤 営業 30\nE02 鈴木 営業 25\nE03 高橋 開発 40\nE04 田中 開発 35\nE05 伊藤 開発 30\n次のSQLを実行したとき、2番目に表示される氏名はどれか。\nSELECT 氏名 FROM 社員 ORDER BY 給与 DESC","choices":["高橋","鈴木","佐藤","田中"],"answer":3,"exp":"給与の降順では、高橋（40）、田中（35）、佐藤と伊藤（30）、鈴木（25）の順になるので、2番目は田中である。"},{"q":"表「社員」は次のとおりである。給与の単位は万円とする。\n社員番号 氏名 部署 給与\nE01 佐藤 営業 30\nE02 鈴木 営業 25\nE03 高橋 開発 40\nE04 田中 開発 35\nE05 伊藤 開発 30\n次のSQLを実行したとき、部署「営業」の給与合計はどれか。\nSELECT 部署, SUM(給与) FROM 社員 GROUP BY 部署","choices":["55","105","27.5","160"],"answer":0,"exp":"営業の給与合計は、30 ＋ 25 = 55である。"}]},{"id":"6-08","title":"SQL（副問合せ）","questions":[{"q":"表「商品」は次のとおりである。\n商品コード 商品名 分類 単価\nA01 りんご 食品 150\nA02 みかん 食品 100\nA03 ノート 文具 200\nA04 えんぴつ 文具 80\nA05 ぶどう 食品 300\n次のSQLを実行したとき、抽出される商品名の組合せはどれか。\nSELECT 商品名 FROM 商品 WHERE 単価 > (SELECT AVG(単価) FROM 商品)","choices":["りんご と ぶどう","ノート と ぶどう","ぶどう だけ","りんご と ノート と ぶどう"],"answer":1,"exp":"単価の平均は（150＋100＋200＋80＋300）÷ 5 = 166であり、これより高いのはノート（200）とぶどう（300）である。"},{"q":"表「商品」は次のとおりである。\n商品コード 商品名 分類 単価\nA01 りんご 食品 150\nA02 みかん 食品 100\nA03 ノート 文具 200\nA04 えんぴつ 文具 80\nA05 ぶどう 食品 300\n次のSQLを実行したとき、抽出される商品名はどれか。\nSELECT 商品名 FROM 商品 WHERE 単価 = (SELECT MAX(単価) FROM 商品)","choices":["りんご","みかん","ぶどう","ノート"],"answer":2,"exp":"単価の最大値は300であり、該当する商品はぶどうである。"},{"q":"表「商品」は次のとおりである。\n商品コード 商品名 分類 単価\nA01 りんご 食品 150\nA02 みかん 食品 100\nA03 ノート 文具 200\nA04 えんぴつ 文具 80\nA05 ぶどう 食品 300\n表「在庫」の列は商品コードだけであり、行は A01 と A03 である。次のSQLを実行したとき、抽出される商品名の組合せはどれか。\nSELECT 商品名 FROM 商品 WHERE 商品コード IN (SELECT 商品コード FROM 在庫)","choices":["りんご と ノート","みかん と えんぴつ","ぶどう だけ","りんご と みかん"],"answer":0,"exp":"在庫にある商品コード A01 と A03 に対応する商品は、りんご と ノートである。"},{"q":"表「商品」は次のとおりである。\n商品コード 商品名 分類 単価\nA01 りんご 食品 150\nA02 みかん 食品 100\nA03 ノート 文具 200\nA04 えんぴつ 文具 80\nA05 ぶどう 食品 300\n次のSQLを実行した結果はどれか。\nSELECT COUNT(*) FROM 商品 WHERE 単価 < (SELECT AVG(単価) FROM 商品)","choices":["1","2","4","3"],"answer":3,"exp":"単価の平均は166であり、それ未満の行は、りんご（150）、みかん（100）、えんぴつ（80）の3行である。"}]},{"id":"6-09","title":"データベースの応用","questions":[{"q":"分散データベースにおける位置透過性の説明として、適切なものはどれか。","choices":["データの格納場所を利用者が意識することなく利用できること","データの複製を自動的に作成すること","データを暗号化して送信すること","表を正規化すること"],"answer":0,"exp":"位置透過性は、データがどのサイトに格納されているかを利用者が意識せずに利用できる性質である。"},{"q":"NoSQLデータベースの特徴として、適切なものはどれか。","choices":["必ず表形式でデータを管理する","SQLでしか操作できない","キーバリュー型など柔軟なデータモデルを用い、大量データの分散処理に向いている","関係データベースより常に処理が遅い"],"answer":2,"exp":"NoSQLは、キーバリュー型やドキュメント型など柔軟なデータモデルを用い、大量データの分散処理や拡張性に優れる。"},{"q":"データウェアハウスの特徴として、適切なものはどれか。","choices":["日々の業務処理を高速に実行するためのものである","業務データを主題別に統合し、時系列で蓄積して分析に利用する","データは頻繁に更新・削除される","部門ごとの小さな分析用データベースである"],"answer":1,"exp":"データウェアハウスは、業務システムのデータを主題別に統合し、時系列に蓄積して分析に利用する。部門単位の小さな分析用DBはデータマートである。"},{"q":"データマイニングの説明として、適切なものはどれか。","choices":["大量のデータを圧縮して保存すること","データを別の場所へ複製すること","不要なデータを削除すること","大量のデータから、統計的手法などを用いて有用な規則性や関係を見つけ出すこと"],"answer":3,"exp":"データマイニングは、蓄積された大量のデータから有用な規則性やパターンを発見する手法である。"}]},{"id":"7-01","title":"ネットワーク方式","questions":[{"q":"WANの説明として、適切なものはどれか。","choices":["1つの建物の中だけを接続するネットワーク","離れた拠点間を、通信事業者の回線を使って接続する広域のネットワーク","1台のパソコンの中の部品同士を接続する方式","無線だけを使って接続するネットワーク"],"answer":1,"exp":"WANは、地理的に離れた拠点を通信事業者の回線で結ぶ広域ネットワークである。"},{"q":"無線LANのセキュリティ方式であるWPA2-PSKの説明として、適切なものはどれか。","choices":["接続する機器ごとに異なる証明書を使う方式","事前に共有した鍵（パスフレーズ）を用いて認証と暗号化を行う方式","暗号化を行わず、誰でも接続できる方式","有線LANだけで使われる方式"],"answer":1,"exp":"WPA2-PSKは、アクセスポイントと端末が事前に共有した鍵（プリシェアードキー）を用いる方式で、主に家庭や小規模なネットワークで使われる。"},{"q":"スター型のLANトポロジの説明として、適切なものはどれか。","choices":["中央の集線装置に、各ノードが接続される形態である","全てのノードが1本の伝送路を共有する形態である","ノード同士が輪の形に接続される形態である","全てのノード同士が直接接続される形態である"],"answer":0,"exp":"スター型は、スイッチなどの中央の集線装置を中心に各ノードを接続する形態である。"},{"q":"無線LANで使われるアクセス制御方式CSMA/CAの説明として、適切なものはどれか。","choices":["衝突を検出したら直ちに再送する方式","送信の許可を中央の装置が順番に与える方式","有線LANでのみ使われる方式","衝突が起きないよう、送信前に回線の空きを確認して回避する方式"],"answer":3,"exp":"無線では衝突の検出が難しいため、CSMA/CAでは送信前に通信路が使用中でないことを確認し、待ち時間を設けることで衝突を回避する。"}]},{"id":"7-02","title":"通信プロトコル","questions":[{"q":"OSI基本参照モデルで、ルータが中継の判断を行うネットワーク層は第何層か。","choices":["第2層","第4層","第3層","第1層"],"answer":2,"exp":"ネットワーク層は第3層で、IPアドレスを用いた経路選択と中継を行う。"},{"q":"TCPの特徴として、適切なものはどれか。","choices":["コネクション型で、再送制御などにより信頼性の高い通信を行う","コネクションレス型で、到達の確認を行わない","主に画像データの圧縮に使われるプロトコルである","電子メールの送信に使われるプロトコルである"],"answer":0,"exp":"TCPはコネクション型のプロトコルで、確認応答や再送により信頼性を確保する。"},{"q":"UDPが適している通信として、適切なものはどれか。","choices":["ファイルの正確な転送","電子メールの送信","データベースの更新","多少の欠落よりもリアルタイム性が求められる音声や動画の配信"],"answer":3,"exp":"UDPはコネクションレスで処理が軽く、遅延が小さいため、リアルタイム性が求められる配信に適する。"},{"q":"電子メールの送信に使われるプロトコルはどれか。","choices":["FTP","SMTP","HTTP","DNS"],"answer":1,"exp":"SMTPは、メールを送信したりメールサーバ間で転送したりするためのプロトコルである。"}]},{"id":"7-03","title":"ネットワーク接続機器","questions":[{"q":"ルータの役割として、適切なものはどれか。","choices":["IPアドレスを見て、異なるネットワーク間でパケットを中継する","減衰した電気信号を増幅する","MACアドレスだけを見て同一ネットワーク内で転送する","アナログ信号とディジタル信号を変換する"],"answer":0,"exp":"ルータはネットワーク層の機器で、IPアドレスに基づいて経路を選択し、ネットワーク間で中継する。"},{"q":"ゲートウェイの説明として、適切なものはどれか。","choices":["信号の届く距離を延長する機器","同一ネットワーク内で端末を増やすための機器","無線と有線を変換するだけの機器","プロトコルの異なるネットワーク同士を、変換を行って接続する機器"],"answer":3,"exp":"ゲートウェイは、上位層でプロトコル変換を行い、異なるプロトコルのネットワークを接続する。"},{"q":"スイッチ（L2スイッチ）が転送先を決めるために使う情報はどれか。","choices":["IPアドレス","MACアドレス","ポート番号","ドメイン名"],"answer":1,"exp":"L2スイッチはデータリンク層の機器で、フレームの宛先MACアドレスを見て転送先を決める。"},{"q":"リピータの役割として、適切なものはどれか。","choices":["IPアドレスの自動割り当てを行う","暗号化された通信を復号する","減衰した信号を増幅・整形して中継し、伝送距離を延ばす","異なるネットワーク間の経路を決める"],"answer":2,"exp":"リピータは物理層の機器で、減衰した信号を増幅・整形して中継する。"}]},{"id":"7-04","title":"IPアドレス","questions":[{"q":"IPv4アドレスのビット数はどれか。","choices":["16ビット","48ビット","128ビット","32ビット"],"answer":3,"exp":"IPv4アドレスは32ビットで、8ビットごとの4つの組で表記される。"},{"q":"DNSの役割として、適切なものはどれか。","choices":["ドメイン名から、対応するIPアドレスを問い合わせて取得する仕組み","端末へIPアドレスを自動的に割り当てる仕組み","プライベートIPアドレスとグローバルIPアドレスを変換する仕組み","メールをサーバ間で転送する仕組み"],"answer":0,"exp":"DNSは、通信相手のドメイン名からIPアドレスを問い合わせる仕組みである。IPアドレスの自動割当てはDHCPの役割である。"},{"q":"DHCPの役割として、適切なものはどれか。","choices":["ドメイン名とIPアドレスを対応付ける","IPアドレスなどの設定情報を、端末へ自動的に割り当てる","複数の端末で1つのグローバルIPアドレスを共有する","通信内容を暗号化する"],"answer":1,"exp":"DHCPは、ネットワークに接続した端末へIPアドレスなどの設定情報を自動的に割り当てる仕組みである。"},{"q":"NATの説明として、適切なものはどれか。","choices":["ドメイン名とIPアドレスを対応付ける仕組み","プライベートIPアドレスとグローバルIPアドレスを変換する仕組み","IPアドレスを端末へ自動的に割り当てる仕組み","通信の経路を自動的に決める仕組み"],"answer":1,"exp":"NATは、LAN内のプライベートIPアドレスとインターネット側のグローバルIPアドレスを変換する。"}]},{"id":"7-05","title":"IPアドレスのクラス","questions":[{"q":"クラスAのIPアドレスで、ネットワーク部として使われるのは先頭から何ビットか。","choices":["16ビット","24ビット","8ビット","4ビット"],"answer":2,"exp":"クラスAは先頭の8ビットがネットワーク部で、大規模なネットワーク向けである。"},{"q":"IPアドレス192.168.1.1が属するクラスはどれか。","choices":["クラスA","クラスC","クラスB","クラスD"],"answer":1,"exp":"先頭のオクテットが192〜223のアドレスはクラスCに属する。"},{"q":"クラスBのデフォルトのサブネットマスクはどれか。","choices":["255.255.0.0","255.0.0.0","255.255.255.0","255.255.255.255"],"answer":0,"exp":"クラスBはネットワーク部が16ビットなので、デフォルトのサブネットマスクは255.255.0.0である。"},{"q":"クラスBのIPアドレスで、第1オクテットの値の範囲はどれか。","choices":["1〜126","128〜191","192〜223","224〜239"],"answer":1,"exp":"クラスBは先頭の2ビットが「10」のアドレスで、第1オクテットは128〜191の範囲になる。クラスAは1〜126、クラスCは192〜223である。"}]},{"id":"7-06","title":"インターネットの応用","questions":[{"q":"URL「https://www.example.co.jp:8080/index.html」において、ポート番号を表す部分はどれか。","choices":["https","www.example.co.jp","8080","index.html"],"answer":2,"exp":"URLは、プロトコル、ホスト名、ポート番号、パスの順に構成される。このURLでは8080がポート番号である。"},{"q":"伝送速度が100Mビット/秒の回線を使って、200Mバイトのデータを伝送するのに要する時間はどれか。伝送効率は100%とする。","choices":["2秒","8秒","16秒","20秒"],"answer":2,"exp":"200Mバイトは1,600Mビットであり、1,600 ÷ 100 = 16秒となる。"},{"q":"プロキシサーバの説明として、適切なものはどれか。","choices":["IPアドレスを自動で割り当てるサーバ","クライアントに代わってWebサーバへ接続する中継サーバ","メールを蓄積するサーバ","ドメイン名を管理するサーバ"],"answer":1,"exp":"プロキシサーバは、クライアントの代理としてWebサーバへ接続し、キャッシュやアクセス制御にも使われる。"},{"q":"HTTPSの説明として、適切なものはどれか。","choices":["HTTPの通信を暗号化し、安全に送受信できるようにしたもの","HTMLを高速に転送するための方式","メール送信用のプロトコルを改良したもの","画像専用の転送プロトコル"],"answer":0,"exp":"HTTPSは、HTTPにSSL/TLSによる暗号化を加え、盗聴や改ざんを防ぐ。"}]},{"id":"8-01","title":"情報セキュリティ管理","questions":[{"q":"プライバシーバイデザインの説明として、適切なものはどれか。","choices":["事故が起きた後に、個人情報の取扱いを見直す考え方","システムの設計段階から、プライバシー保護を組み込む考え方","個人情報を暗号化して保存することだけを指す考え方","プライバシーに関する規程文書を作成することだけを指す考え方"],"answer":1,"exp":"プライバシーバイデザインは、システムやサービスの企画・設計の段階からプライバシー保護を組み込む考え方である。"},{"q":"ISMSの説明として、適切なものはどれか。","choices":["暗号化のための国際規格","組織が情報セキュリティを管理するための仕組み","ネットワークを監視する装置","ウイルスを検出するソフトウェア"],"answer":1,"exp":"ISMSは情報セキュリティマネジメントシステムの略で、組織的に情報セキュリティを管理する仕組みである。"},{"q":"リスクアセスメントの説明として、適切なものはどれか。","choices":["事故が起きた後に被害額を計算すること","保険へ加入してリスクを移すこと","リスクを特定し、分析・評価するプロセス","リスクのある業務を全て廃止すること"],"answer":2,"exp":"リスクアセスメントは、リスクを特定し、その大きさや影響を分析・評価する一連のプロセスである。"},{"q":"情報セキュリティポリシのうち、基本方針に含まれる内容として、適切なものはどれか。","choices":["パスワードの具体的な設定手順","組織としての情報セキュリティへの取組み方針","ファイアウォールの設定値の一覧","ウイルス対策ソフトの操作方法"],"answer":1,"exp":"基本方針は、組織の情報セキュリティへの取組み姿勢や方針を示す最上位の文書である。"}]},{"id":"8-02","title":"脅威とマルウェア","questions":[{"q":"マルウェア対策ソフトにおけるフォールスネガティブの説明として、適切なものはどれか。","choices":["正常なファイルをマルウェアと誤って検知すること","マルウェアを検知できず、見逃してしまうこと","マルウェアを検知して自動的に削除すること","検知したマルウェアを隔離すること"],"answer":1,"exp":"フォールスネガティブは、マルウェアであるにもかかわらず検知できない見逃しを指す。正常なものを誤って検知するのはフォールスポジティブである。"},{"q":"入退室管理におけるアンチパスバックの説明として、適切なものはどれか。","choices":["入室の記録がないまま退室しようとするなど、不整合な入退室を防止する仕組み","ICカードを複製して使えるようにする仕組み","退室の記録だけを残す仕組み","複数人が同時に入室できるようにする仕組み"],"answer":0,"exp":"アンチパスバックは、入室記録と退室記録の整合性を取ることで、カードの貸し借りによる不正な入退室などを防ぐ仕組みである。"},{"q":"ノートパソコンの盗難や紛失による情報漏えい対策として、ストレージ全体の暗号化が有効とされる理由はどれか。","choices":["パソコンの処理速度が向上するから","第三者がストレージを取り出して読み取っても、内容を解読できないから","ウイルスに感染しなくなるから","バッテリーの消費が少なくなるから"],"answer":1,"exp":"ストレージを暗号化しておけば、盗難や紛失で媒体が第三者の手に渡っても、鍵がなければデータを読み取ることができない。"},{"q":"スパイウェアの説明として、適切なものはどれか。","choices":["ハードディスクを物理的に破壊する","画面に大量の広告を表示するだけのもの","利用者の行動や個人情報を密かに収集し、外部へ送信する","ネットワーク機器のファームウェアを書き換える"],"answer":2,"exp":"スパイウェアは、利用者に気付かれないよう個人情報などを収集し、外部へ送信するマルウェアである。"}]},{"id":"8-03","title":"サイバー攻撃","questions":[{"q":"DoS攻撃の説明として、適切なものはどれか。","choices":["大量のリクエストを送り付け、サーバのサービスを停止させる攻撃","データベースへ不正な命令を入力する攻撃","偽のWebサイトで個人情報を騙し取る攻撃","プログラムの欠陥を突いて管理者権限を奪う攻撃"],"answer":0,"exp":"DoS攻撃は、過大な負荷をかけてシステムやサービスを利用できない状態にする攻撃である。"},{"q":"リバースブルートフォース攻撃の説明として、適切なものはどれか。","choices":["一つのIDに対して、多数のパスワードを試す攻撃","一つのパスワードに対して、多数のIDを試す攻撃","盗んだパスワードの一覧を使って試す攻撃","通信を傍受してパスワードを読み取る攻撃"],"answer":1,"exp":"リバースブルートフォース攻撃は、パスワードを固定し、IDを変えながらログインを試す攻撃である。一つのIDに多数のパスワードを試す通常のブルートフォース攻撃とは逆の関係にある。"},{"q":"フィッシングの説明として、適切なものはどれか。","choices":["実在の企業などを装った偽のサイトやメールで、個人情報を騙し取る手口","総当たりでパスワードを試す手口","無線LANの電波を妨害する手口","サーバの時刻をずらす手口"],"answer":0,"exp":"フィッシングは、金融機関などを装った偽サイトへ誘導し、IDやパスワードなどを入力させる手口である。"},{"q":"クロスサイトスクリプティング（XSS）の説明として、適切なものはどれか。","choices":["サーバへ大量の接続要求を送る攻撃","暗号化された通信を解読する攻撃","Webサイトの脆弱性を利用し、利用者のブラウザで悪意あるスクリプトを実行させる攻撃","データベースのデータを全て消去する攻撃"],"answer":2,"exp":"XSSは、脆弱なWebサイトにスクリプトを埋め込み、閲覧した利用者のブラウザで実行させる攻撃である。"}]},{"id":"8-04","title":"暗号技術","questions":[{"q":"共通鍵暗号方式の特徴として、適切なものはどれか。","choices":["暗号化と復号に別々の鍵を使う","暗号化と復号に同じ鍵を使う","鍵を公開しても安全である","処理が公開鍵暗号方式より遅い"],"answer":1,"exp":"共通鍵暗号方式は、暗号化と復号に同一の鍵を使い、処理が高速である。AESが代表例である。"},{"q":"公開鍵暗号方式を利用して、受信者だけが復号できるようにデータを暗号化する場合、暗号化に使う鍵として適切なものはどれか。","choices":["受信者の公開鍵","送信者の秘密鍵","送信者と受信者で共有する共通鍵","受信者の秘密鍵"],"answer":0,"exp":"公開鍵暗号方式では、受信者の公開鍵で暗号化し、受信者だけが持つ秘密鍵で復号する。"},{"q":"ハイブリッド暗号方式の説明として、適切なものはどれか。","choices":["データを共通鍵で暗号化し、その共通鍵を公開鍵暗号方式で暗号化して送る","2種類のハッシュ関数を組み合わせる方式","鍵を使わずに暗号化する方式","同じデータを2回暗号化する方式"],"answer":0,"exp":"ハイブリッド暗号方式は、データ本体を高速な共通鍵暗号方式で暗号化し、その共通鍵の安全な共有に公開鍵暗号方式などを利用する方式である。TLSなどでも、公開鍵暗号技術を用いて安全に鍵を共有し、その鍵に基づく共通鍵暗号方式で通信データを保護するという組合せが利用される。"},{"q":"ハッシュ関数の性質として、適切なものはどれか。","choices":["ハッシュ値から元のデータを復元できる","入力が同じでも毎回異なるハッシュ値になる","入力が異なれば必ず異なるハッシュ値になる","入力から元のデータを復元できない一方向性をもつ"],"answer":3,"exp":"ハッシュ関数は、ハッシュ値から元のデータを求めることが現実的に困難であるという一方向性をもつ。この性質などを利用して、データの改ざん検出に用いられる。ただし、改ざんの検出には、比較する正しいハッシュ値自体が改ざんされていないことが前提になる。なお、異なる入力から同じハッシュ値が得られる衝突は理論上あり得るため、「入力が異なれば必ず異なるハッシュ値になる」という説明は誤りである。"}]},{"id":"8-05","title":"認証技術","questions":[{"q":"認証局（CA）が発行するCRL（証明書失効リスト）の説明として、適切なものはどれか。","choices":["有効期限内に失効したデジタル証明書の一覧","新たに発行されたデジタル証明書の一覧","認証局の公開鍵の一覧","証明書の申請者の一覧"],"answer":0,"exp":"CRLは、有効期限を迎える前に失効したデジタル証明書を集めた一覧であり、認証局が発行する。証明書の検証では、この一覧に載っていないことも確認する。"},{"q":"認証局（CA）の役割として、適切なものはどれか。","choices":["暗号化通信の中継を行う","公開鍵が本人のものであることを証明する公開鍵証明書を発行する","パスワードの強度を検査する","ウイルス定義ファイルを配布する"],"answer":1,"exp":"認証局は、公開鍵とその所有者を結び付けた公開鍵証明書を発行する信頼できる第三者機関である。"},{"q":"IoTデバイスにおける耐タンパ性の説明として、適切なものはどれか。","choices":["高温や低温の環境でも動作し続ける性質","装置の内部を解析したり、秘密情報を不正に読み取ったりすることへの耐性","通信の遅延が小さい性質","消費電力が小さい性質"],"answer":1,"exp":"耐タンパ性は、装置への物理的な攻撃や内部解析によって、秘密情報が読み取られたり改ざんされたりすることへの耐性を指す。"},{"q":"タイムスタンプ（時刻認証）の役割として、適切なものはどれか。","choices":["データの暗号化を行う","データの送信速度を記録する","データの所有者を証明する","ある時刻にそのデータが存在していたことを証明する"],"answer":3,"exp":"タイムスタンプは、時刻認証局が時刻を証明することで、その時刻にデータが存在し、それ以降改ざんされていないことを示せる。"}]},{"id":"8-06","title":"利用者認証とネットワークセキュリティ","questions":[{"q":"バイオメトリクス認証の説明として、適切なものはどれか。","choices":["パスワードと暗証番号を組み合わせる認証","ICカードをかざす認証","指紋や顔など、身体的特徴を利用する認証","質問と答えを使う認証"],"answer":2,"exp":"バイオメトリクス認証は、指紋・顔・静脈などの身体的特徴や行動的特徴を利用する生体認証である。"},{"q":"二要素認証の組合せとして、適切なものはどれか。","choices":["パスワードと秘密の質問","パスワード（知識）とICカード（所持）","指紋と顔","パスワードを2つ使う"],"answer":1,"exp":"二要素認証は、知識・所持・生体のうち、異なる2つの要素を組み合わせる。同じ種類を2つ使っても二要素にはならない。"},{"q":"ファイアウォールの機能として、適切なものはどれか。","choices":["送信元や宛先のアドレス、ポート番号などに基づいてパケットの通過を制御する","データを暗号化して送信する","ウイルスを自動で駆除する","IPアドレスを自動で割り当てる"],"answer":0,"exp":"ファイアウォールは、アドレスやポート番号などの条件でパケットフィルタリングを行い、不正な通信を遮断する。"},{"q":"VPNの説明として、適切なものはどれか。","choices":["社内LANの配線を無線化する技術","ウイルスの感染経路を追跡する技術","IPアドレスを自動で割り当てる仕組み","インターネットなどの公衆ネットワーク上に、暗号化された仮想的な専用回線を構築する技術"],"answer":3,"exp":"VPNは、公衆ネットワーク上で暗号化通信を行い、専用回線のように安全に通信できる技術である。"}]},{"id":"9-01","questions":[{"answer":1,"choices":["調達先候補のベンダに対して、調達の目的や条件を示し、具体的な提案書の提出を求める文書","調達先候補のベンダに対して、製品や技術動向など、システム導入の検討に必要な情報の提供を求める文書","選定したベンダに対して、契約条件の詳細を示して見積書の提出を求める文書","ベンダとの契約締結後に、納品物の仕様を確定させるために作成する文書"],"exp":"RFIは提案依頼書（RFP）を出す前の段階で、ベンダに る場合に適したGUI部品はどれか。"},{"answer":3,"choices":["情報を詰め込むために文字をできるだけ小さくする","操作の案内は音声だけで提供する","重要な情報の区別は色の違いだけで行う","画像には、その内容を表す代替テキストを用意する"],"exp":"画像に代替テキストを用意することで、音声読み上げソフトを使う利用者にも画像の内容が伝わる。色だけで情報を区別すると、色覚の特性によって区別できない場合がある。","q":"Webページのアクセシビリティへの配慮として、適切なものはどれか。"},{"answer":1,"choices":["エラーコードだけを表示する","誤りの箇所と、どのように修正すればよいかを具体的に示す","利用者の操作ミスであることを強調する","専門用語を使って原因を詳しく説明する"],"exp":"エラーメッセージは、どこが誤りでどう直せばよいかを利用者がその場で分かるように示すことが重要である。コードだけの表示では利用者が対処できない。","q":"入力エラーが発生したときのエラーメッセージの設計として、適切なものはどれか。"}],"title":"ユーザインタフェース"},{"id":"9-06","questions":[{"answer":2,"choices":["時間的強度","論理的強度","機能的強度","連絡的強度"],"exp":"機能的強度は、モジュール内の要素が単一の機能を実現するために集まっている状態で、強度が最も高く最も望ましい。","q":"モジュール強度（凝集度）のうち、最も望ましいとされるものはどれか。"},{"answer":3,"choices":["内容結合","共通結合","制御結合","データ結合"],"exp":"データ結合は、引数として必要なデータだけを受け渡す結合で、結合度が最も低い。結合度が低いほどモジュールの独立性が高くなる。","q":"モジュール結合度のうち、結合度が最も低く、最も望ましいとされるものはどれか。"},{"answer":0,"choices":["モジュール強度を高くし、モジュール結合度を低くする","モジュール強度もモジュール結合度も高くする","モジュール強度を低くし、モジュール結合度を高くする","モジュール強度もモジュール結合度も低くする"],"exp":"モジュールの独立性は、内部のまとまりである強度を高くし、モジュール間の結び付きである結合度を低くすることで高まる。独立性が高いほど保守や再利用がしやすい。","q":"モジュールの独立性を高めるための方針として、適切なものはどれか。"},{"answer":1,"choices":["データ結合","共通結合","スタンプ結合","内容結合"],"exp":"共通結合は、複数のモジュールが共通領域（大域データ）を参照する結合である。データの変更が多くのモジュールに影響するため、結合度は比較的高い。","q":"複数のモジュールが、大域的な共通領域のデータを参照・更新することで結び付いている結合はどれか。"}],"title":"モジュール分割"},{"id":"9-07","questions":[{"answer":1,"choices":["プログラムの内部構造に基づいてテストケースを作成する手法","入力条件の境界となる値と、その前後の値を重点的にテストする手法","過去の障害事例からエラーがありそうな箇所を推測する手法","実際の運用環境で利用者に試用してもらう手法"],"exp":"境界値分析は、仕様で定められた範囲の境界付近でエラーが発生しやすいことに着目し、境界値とその前後の値をテストケースに選ぶ手法である。内部構造に基づくのはホワイトボックステストである。","q":"ブラックボックステストの技法である境界値分析の説明として、適切なものはどれか。"},{"answer":3,"choices":["エミュレータ","ドライバ","シミュレータ","スタブ"],"exp":"トップダウンテストでは、未完成の下位モジュールの代わりにスタブを用いる。逆にボトムアップテストで上位モジュールの代わりに用いるのがドライバである。","q":"トップダウンテストを実施する際に、上位モジュールの代わりとして用意するものはどれか。"},{"answer":0,"choices":["プログラム内の全ての判定条件における分岐を、少なくとも1回は実行すること","プログラム内の全ての命令を、少なくとも1回は実行すること","入力データの全ての組合せを少なくとも1回は実行すること","仕様上の全ての境界値を少なくとも1回は実行すること"],"exp":"分岐網羅は、全ての判定の分岐先を少なくとも1回実行する網羅基準である。全ての命令を対象とするのは命令網羅で、分岐網羅の方が基準が強い。","q":"ホワイトボックステストにおける分岐網羅（ブランチカバレッジ）の説明として、適切なものはどれか。"},{"answer":2,"choices":["システムの処理性能を測定すること","利用者が要求を満たしているか確認すること","プログラムの修正後に、修正箇所以外の部分へ悪影響が出ていないかを確認すること","新規に追加した機能だけを確認すること"],"exp":"回帰テストは、修正や機能追加を行った際に、それまで正常だった部分に新たな不具合（デグレード）が生じていないかを確認するテストである。","q":"回帰テスト（リグレッションテスト）の目的として、適切なものはどれか。"}],"title":"テスト手法"},{"id":"10-01","questions":[{"answer":0,"choices":["プロジェクトの成果物と作業を、階層構造に分解したもの","各作業の所要時間を見積もるための手法","プロジェクトのリスクを洗い出して一覧化したもの","プロジェクト要員の配置を表したもの"],"exp":"WBSは、プロジェクトの成果物と必要な作業を階層的に分解し、全体の作業範囲を明確にしたものである。スケジュールやコスト見積りの基礎となる。","q":"WBS（Work Breakdown Structure）の説明として、適切なものはどれか。"},{"answer":2,"choices":["プロジェクトの詳細なスケジュールを定めた文書","テストの実施内容を定めた計画書","プロジェクトの存在を公式に認め、プロジェクトマネージャに資源を使用する権限を与える文書","プロジェクト会議の決定事項を記録した議事録"],"exp":"プロジェクト憲章は、プロジェクトの開始を公式に承認し、プロジェクトマネージャを任命して権限を与える文書であり、通常はスポンサーが発行する。","q":"プロジェクト憲章の説明として、適切なものはどれか。"},{"answer":3,"choices":["プロジェクトのスポンサーだけを指す","発注者である顧客だけを指す","株主だけを指す","プロジェクトの影響を受ける、又はプロジェクトに影響を与える利害関係者"],"exp":"ステークホルダは、顧客やスポンサー、プロジェクトチームだけでなく、プロジェクトの成果によって影響を受ける全ての利害関係者を含む。","q":"プロジェクトマネジメントにおけるステークホルダの説明として、適切なものはどれか。"},{"answer":1,"choices":["反復性と継続性","有期性と独自性","定型性と永続性","均一性と反復性"],"exp":"プロジェクトは、始まりと終わりが定まった有期性と、独自の成果物を生み出す独自性を持つ活動であり、定常業務とは区別される。","q":"プロジェクトの特徴として、適切なものはどれか。"}],"title":"プロジェクトマネジメント"},{"id":"10-02","questions":[{"answer":0,"choices":["CV＝−5万円，SV＝−10万円","CV＝−10万円，SV＝−5万円","CV＝5万円，SV＝−10万円","CV＝−5万円，SV＝10万円"],"exp":"CV＝EV−AC＝90−95＝−5万円、SV＝EV−PV＝90−100＝−10万円であり、コストは超過し、進捗も遅れている状態である。","q":"あるプロジェクトの進捗測定時点で、PVが100万円、EVが90万円、ACが95万円であった。コスト差異（CV）とスケジュール差異（SV）の組合せとして、正しいものはどれか。"},{"answer":3,"choices":["進捗は順調で、コストも予算内である","進捗は遅れているが、コストは予算内である","進捗は順調だが、コストは超過している","進捗は遅れており、コストも超過している"],"exp":"SPI＝EV÷PV＝160÷200＝0.8で1未満のため進捗は遅れており、CPI＝EV÷AC＝160÷200＝0.8で1未満のためコストも超過している。","q":"PVが200万円、EVが160万円、ACが200万円であるプロジェクトの状態として、正しいものはどれか。"},{"answer":2,"choices":["800万円","1,000万円","1,250万円","1,800万円"],"exp":"今後も同じコスト効率が続く場合、EAC＝BAC÷CPI＝1,000÷0.8＝1,250万円となる。","q":"プロジェクトの予算総額（BAC）が1,000万円で、現時点のコスト効率（CPI）が0.8であった。今後も同じコスト効率が続くと仮定した場合、完成時総コスト見積り（EAC）はどれか。"},{"answer":1,"choices":["スコープを段階的に詳細化していくこと","承認や管理がされないまま、プロジェクトのスコープが徐々に拡大していくこと","決定したスコープを文書化して関係者に共有すること","要件の変更を受け付けず、スコープを凍結すること"],"exp":"スコープクリープは、正式な変更管理を通さずに作業範囲が少しずつ膨らんでいく現象で、コスト超過や納期遅延の原因となる。","q":"スコープクリープの説明として、適切なものはどれか。"}],"title":"スコープ・コストマネジメント"},{"id":"10-03","questions":[{"answer":2,"choices":["10日","11日","12日","15日"],"exp":"経路A→B→Dは3＋4＋3＝10日、経路A→C→Eは3＋5＋4＝12日であり、最長経路である12日がクリティカルパスの所要日数となる。","q":"アローダイアグラムにおいて、作業A（3日）の後に作業B（4日）と作業C（5日）が分岐し、Bの後には作業D（3日）、Cの後には作業E（4日）が続き、DとEの両方が終わるとプロジェクトが完了する。クリティカルパスの所要日数はどれか。"},{"answer":1,"choices":["5日","6日","7日","8日"],"exp":"三点見積りの期待値は（楽観値＋4×最可能値＋悲観値）÷6＝（2＋20＋14）÷6＝6日である。","q":"PERTの三点見積りにおいて、楽観値が2日、最可能値が5日、悲観値が14日のとき、期待所要日数はどれか。"},{"answer":1,"choices":["最も大きい","0である","最も小さいが、0よりは大きい","計算できない"],"exp":"クリティカルパスはプロジェクト全体の最長経路であり、その上の作業には余裕が無いため、総フロートは0である。フロートがある作業が遅れても全体に影響しないのは、フロートの範囲内だけである。","q":"クリティカルパス上にある作業の総フロート（余裕時間）はどれか。"},{"answer":3,"choices":["モンテカルロ法","クラッシング","デルファイ法","ファストトラッキング"],"exp":"ファストトラッキングは、直列の作業を並行化して期間を短縮する手法である。クラッシングは要員などの資源を追加投入して短縮する手法である。","q":"当初は直列に実施する予定だった作業を並行して実施することで、スケジュールを短縮する手法はどれか。"}],"title":"タイムマネジメント"},{"id":"10-04","questions":[{"answer":0,"choices":["通常のサービス運用を、可能な限り速やかに回復すること","障害の根本原因を究明し、再発を防止すること","システムへの変更を承認すること","構成品目の情報を正確に記録すること"],"exp":"インシデント管理は、障害などによって中断したサービスを速やかに復旧することを目的とする。根本原因の究明と再発防止は問題管理の役割である。","q":"ITILにおけるインシデント管理の目的として、適切なものはどれか。"},{"answer":1,"choices":["インシデントに対する応急復旧","インシデントの根本原因の特定と、恒久対策の検討","SLAの締結","サービスデスクでの問合せ受付"],"exp":"問題管理は、インシデントの根本原因を特定し、既知のエラーとして管理しながら恒久的な解決策を検討するプロセスである。","q":"問題管理プロセスで実施する活動として、適切なものはどれか。"},{"answer":3,"choices":["障害発生時の復旧手順を定めた手順書","システムの構成品目を一覧化した台帳","サービス提供組織の内部だけで使う作業指示書","サービス提供者と顧客が合意した、サービスの品質水準の内容を定めた合意書"],"exp":"SLAは、可用性や応答時間などのサービスレベルについて、提供者と顧客の間で合意した内容を文書化したものである。","q":"SLA（サービスレベル合意書）の説明として、適切なものはどれか。"},{"answer":2,"choices":["変更要求を承認する機関","システム監査を実施する主体","利用者からの問合せや障害の報告を受ける、単一の窓口（SPOC）","データセンタの設備を運用する部門"],"exp":"サービスデスクは、利用者との単一の連絡窓口（SPOC）として、問合せやインシデントの受付・記録・一次対応を行う機能である。","q":"サービスデスクの説明として、適切なものはどれか。"}],"title":"ITサービスマネジメント"},{"id":"10-05","questions":[{"answer":1,"choices":["監査対象部門の責任者が、自分の部門の監査を兼任する","監査対象から独立した立場の者が監査を行う","システムの運用担当者が、自分の担当業務を監査する","監査の結論は被監査部門の指示に従って決める"],"exp":"システム監査は、客観性を保つために、監査対象の責任者や担当者から独立した立場の監査人が実施しなければならない。","q":"システム監査人の独立性に関する説明として、適切なものはどれか。"},{"answer":2,"choices":["入力データの範囲チェック","計算結果と伝票の照合","システムへのアクセス権限の管理","出力帳票の配布先確認"],"exp":"アクセス権限の管理は、システム全体に共通する基盤面の統制であるIT全般統制に当たる。入力チェックや照合は個々の業務処理に対する業務処理統制である。","q":"IT全般統制に該当するものはどれか。"},{"answer":3,"choices":["本調査 → 予備調査 → 評価・結論","評価・結論 → 本調査 → 予備調査","予備調査 → 評価・結論 → 本調査","予備調査 → 本調査 → 評価・結論"],"exp":"システム監査は、まず予備調査で監査対象の概要を把握して本調査の範囲や方法を決め、本調査で証拠を収集した後、評価・結論として意見を形成する順序で進める。","q":"システム監査の実施手順として、適切な順序はどれか。"},{"answer":0,"choices":["業務の申請者と承認者を分けることで、不正や誤りが発生しにくい仕組みにすること","業務効率を上げるために、一連の業務を一人に集中させること","監査の実施を不要にすること","業務の記録を残さないようにすること"],"exp":"職務分掌は、申請と承認、処理と記録のように相互牽制が働く業務を分担させることで、不正や誤りの発生と見逃しを防ぐ統制である。","q":"内部統制における職務分掌の目的として、適切なものはどれか。"}],"title":"システム監査と内部統制"},{"id":"11-01","questions":[{"answer":0,"choices":["顧客の経営課題を解決するため、システムの企画・構築から運用までを総合的に提供するビジネス","自社製品のハードウェアを大量に販売するビジネス","ソフトウェアのライセンス販売だけを行うビジネス","顧客企業の業務全般を丸ごと代行するビジネス"],"exp":"ソリューションビジネスは、顧客の課題を分析し、最適なシステムの提案・構築・運用までを一貫して提供する事業である。","q":"ソリューションビジネスの説明として、適切なものはどれか。"},{"answer":2,"choices":["利用者がソフトウェアを購入し、自社のサーバに導入して使う形態","ソフトウェアをパッケージ製品として店舗で販売する形態","インターネット経由でソフトウェアの機能を提供し、利用者が必要なときに利用する形態","ソフトウェアのソースコードを無償で公開する形態"],"exp":"SaaSは、事業者がインターネット経由でソフトウェアの機能を提供し、利用者はインストールせずにブラウザなどから利用する形態である。","q":"SaaSの説明として、適切なものはどれか。"},{"answer":1,"choices":["自社の従業員数を増やすこと","業務の一部を外部の専門業者に委託し、経営資源を中核業務に集中させること","情報システムの開発を全て自社内で行うこと","競合他社の経営情報を収集すること"],"exp":"アウトソーシングは、定型業務などを外部に委託することで、自社の経営資源を中核業務（コア業務）に集中させるために活用される。","q":"企業がアウトソーシングを活用する主な目的として、適切なものはどれか。"},{"answer":3,"choices":["情報システム部門における日常の運用作業を担当すること","プログラム開発作業の進捗を管理すること","株主総会の運営を担当すること","経営戦略に基づく情報化戦略の策定など、情報システム全体を統括すること"],"exp":"CIOは経営層の一員として、経営戦略に沿った情報化戦略を策定し、企業全体の情報システムを統括する責任者である。","q":"CIO（最高情報責任者）の役割として、適切なものはどれか。"}],"title":"ソリューションビジネスとシステム活用促進"},{"id":"11-02","questions":[{"answer":1,"choices":["製品の価格と原価の関係を分析する手法","内部環境の強み・弱みと、外部環境の機会・脅威を整理して分析する手法","事業を市場成長率と相対的市場シェアで分類する手法","顧客を年齢や性別などの属性で細分化する手法"],"exp":"SWOT分析は、自社の内部環境である強み（Strength）と弱み（Weakness）、外部環境である機会（Opportunity）と脅威（Threat）を整理して戦略立案に役立てる手法である。","q":"SWOT分析の説明として、適切なものはどれか。"},{"answer":3,"choices":["市場成長率が高く、相対的市場シェアも高い事業","市場成長率が高いが、相対的市場シェアが低い事業","市場成長率が低く、相対的市場シェアも低い事業","市場成長率は低いが、相対的市場シェアが高く、安定した収益を生む事業"],"exp":"「金のなる木」は市場成長率が低く大きな投資が不要で、相対的市場シェアが高いため安定した資金を生み出す事業である。市場成長率が高くシェアが低いものは「問題児」、両方高いものは「花形」、両方低いものは「負け犬」である。","q":"PPM（プロダクト・ポートフォリオ・マネジメント）における「金のなる木」に分類される事業の説明として、適切なものはどれか。"},{"answer":0,"choices":["特定の顧客層や地域などの市場に経営資源を集中する戦略","業界で最も低いコストを実現し、価格競争力を高める戦略","他社にない独自の価値を提供して差別化を図る戦略","複数の異なる事業分野へ同時に進出する戦略"],"exp":"集中戦略は、特定の市場セグメントに経営資源を集中する戦略である。低コストで優位に立つのはコストリーダーシップ戦略、独自の価値で優位に立つのは差別化戦略である。","q":"M.ポーターの競争戦略における集中戦略の説明として、適切なものはどれか。"},{"answer":2,"choices":["企業が保有する不動産などの有形資産","短期的に獲得できる利益の源泉","他社には真似できない、自社ならではの核となる能力","業界全体で共有されている標準的な技術"],"exp":"コアコンピタンスは、顧客に独自の価値を提供でき、他社が容易に真似できない自社の中核的な能力を指す。","q":"コアコンピタンスの説明として、適切なものはどれか。"}],"title":"経営戦略"},{"id":"11-03","questions":[{"answer":2,"choices":["製品（Product）","価格（Price）","人材（People）","販売促進（Promotion）"],"exp":"4Pは製品（Product）、価格（Price）、流通（Place）、販売促進（Promotion）の4要素であり、人材（People）は含まれない。","q":"マーケティングミックスの4Pに含まれないものはどれか。"},{"answer":0,"choices":["市場を、顧客のニーズや特性などによって細分化すること","細分化した市場の中から、標的とする市場を選定すること","顧客の心の中での自社製品の位置付けを明確にすること","製品の販売価格を決定すること"],"exp":"セグメンテーションは市場を同質な集団に細分化することである。標的市場の選定はターゲティング、自社製品の位置付けはポジショニングという。","q":"マーケティングにおけるセグメンテーションの説明として、適切なものはどれか。"},{"answer":3,"choices":["従業員の勤怠や給与を管理する手法","製品の在庫量を最適化する手法","広告の費用対効果を測定する手法","顧客との関係を継続的に管理し、顧客満足度や信頼関係を高める手法"],"exp":"CRM（顧客関係管理）は、顧客情報を一元管理して顧客との良好な関係を築き、満足度やロイヤリティの向上を図る手法である。","q":"CRMの説明として、適切なものはどれか。"},{"answer":1,"choices":["新製品の導入時に高価格を設定し、早期に利益を回収する戦略","市場への浸透とシェア拡大を図るため、導入時に低価格を設定する戦略","競合他社の価格に合わせて価格を設定する戦略","製品の原価に一定率の利益を上乗せして価格を設定する方法"],"exp":"ペネトレーションプライスは、市場シェアの拡大を狙って導入時に低価格を設定する戦略である。逆に高価格で始める戦略はスキミングプライス（上澄み吸収価格戦略）という。","q":"ペネトレーションプライス（浸透価格戦略）の説明として、適切なものはどれか。"}],"title":"マーケティング戦略"},{"id":"11-04","questions":[{"answer":3,"choices":["財務の視点","顧客の視点","学習と成長の視点","競合他社の視点"],"exp":"BSCの4つの視点は、財務、顧客、業務プロセス、学習と成長であり、競合他社の視点は含まれない。","q":"バランススコアカード（BSC）で用いられる4つの視点に含まれないものはどれか。"},{"answer":1,"choices":["最終的な経営目標の達成度を示す指標","目標達成に向けた過程を測るための中間的な指標","従業員の給与額を決めるための指標","製品の不良率だけを示す指標"],"exp":"KPIは、最終目標（KGI）の達成に向けて、途中のプロセスが順調かを測る中間指標である。","q":"KPI（重要業績評価指標）の説明として、適切なものはどれか。"},{"answer":2,"choices":["顧客情報を管理するためのシステム","電子メールの送受信を行うためのシステム","販売・生産・会計などの基幹業務を統合し、経営資源を一元管理するシステム","工場の生産機械を制御するためのシステム"],"exp":"ERP（企業資源計画）は、企業の経営資源を有効活用するため、基幹業務を統合し情報を一元管理するシステム（パッケージ）である。","q":"ERPの説明として、適切なものはどれか。"},{"answer":0,"choices":["目標を達成するために、特に大きな影響を与える要因","業務の処理手順を図式化したもの","プロジェクトに割り当てる予算の上限","組織に所属する従業員の総数"],"exp":"CSFは、事業や目標の成否に決定的な影響を与える要因であり、経営資源を優先的に配分する対象を決める際に用いられる。","q":"CSF（重要成功要因）の説明として、適切なものはどれか。"}],"title":"業績評価と経営管理システム"},{"id":"11-05","questions":[{"answer":0,"choices":["自社だけでなく、外部の企業や大学などの技術・アイデアも取り入れて革新を生み出す考え方","研究開発の全てを自社内だけで完結させる考え方","自社が開発した技術を無償で公開する考え方","工場の生産設備を自動化して効率を高める考え方"],"exp":"オープンイノベーションは、外部の知識や技術を積極的に活用し、自社の資源と組み合わせてイノベーションを生み出す考え方である。","q":"オープンイノベーションの説明として、適切なものはどれか。"},{"answer":2,"choices":["基礎研究から開発段階へ進む際に生じる障壁","製品が市場に普及する際に乗り越えるべき障壁","開発段階から事業化へ進む際に生じる、資金不足などによる障壁","特許権を取得する際に生じる障壁"],"exp":"「死の谷」は、研究開発の成果を事業化・製品化する段階で生じる障壁を指す。基礎研究から開発への障壁は「魔の川」、事業化後の市場競争の障壁は「ダーウィンの海」という。","q":"技術開発における「死の谷」の説明として、適切なものはどれか。"},{"answer":3,"choices":["技術者の採用活動を専門に行うこと","工場の生産設備の保守を管理すること","特許権を取得するための手続を行うこと","技術を経営資源として捉え、事業の価値創造につなげる経営の考え方"],"exp":"MOTは、技術を経営資源として戦略的に活用し、イノベーションや事業価値の創造につなげる経営手法である。","q":"MOT（技術経営）の説明として、適切なものはどれか。"},{"answer":1,"choices":["顧客のニーズを出発点として製品を開発する考え方","自社が保有する技術を出発点として製品を開発する考え方","競合製品の価格を基準として製品を開発する考え方","市場で流行している製品を模倣して開発する考え方"],"exp":"シーズ志向は自社の技術（シーズ）を起点とする開発であり、顧客のニーズを起点とする開発はニーズ志向という。","q":"シーズ志向の製品開発の説明として、適切なものはどれか。"}],"titl   const subCount = Object.keys(S.sub).length;
  const allBest = bestAgg(DATA);
  let h = '<h1>基本情報技術者 演習</h1><div class="sub">解いた問題 '+doneQ+' / '+totalQ+'（正解 '+rightQ+'）　結果を送った節 '+subCount+'　全体の最高正解率 '+pct(allBest.r, allBest.t)+'</div>';
  h += '<div class="grid">';
  for(let c=1;c<=11;c++){
    const secs = DATA.filter(s=>chOf(s.id)===c);
    if(secs.length===0){ h += '<button class="btn" disabled>第'+c+'章 '+esc(CH[c])+'<small>準備中</small></button>'; }
    else{
      let d=0,t=0; secs.forEach(s=>{ const st=secStatus(s.id); d+=st.done; t+=st.total; });
      const cb = bestAgg(secs);
      h += '<button class="btn" data-act="ch" data-ch="'+c+'">第'+c+'章 '+esc(CH[c])+'<small>'+d+' / '+t+' 問 済み　最高正解率 '+pct(cb.r, cb.t)+'</small></button>';
    }
  }
  h += '</div>';
  if(wrong>0) h += '<div style="margin-top:12px"><button class="btn accent" data-act="review">間違えた問題を解き直す<small>'+wrong+'問・ランダム順</small></button></div>';
  return h;
}
function sectionsHTML(ch){
  const secs = DATA.filter(s=>chOf(s.id)===ch);
  let h = '<div class="bar"><button class="btn" data-act="home">← 章の一覧</button></div>';
  h += '<h1>第'+ch+'章 '+esc(CH[ch])+'</h1><div class="sub">節を選んでください</div><div class="grid">';
  secs.forEach(s=>{ const st=secStatus(s.id); let label = S.sub[s.id] ? "結果送信済み 正解 "+st.right+"/"+st.total : (st.done===0 ? "未実施" : (st.done<st.total ? "途中 "+st.done+"/"+st.total : "済み 正解 "+st.right+"/"+st.total));
    if(S.tries[s.id]) label += "　チャレンジ "+S.tries[s.id]+" 回";
    if(S.best[s.id]!==undefined) label += "　最高 "+pct(S.best[s.id], st.total);
    h += '<button class="btn" data-act="sec" data-sec="'+s.id+'">'+s.id+' '+esc(s.title)+'<small>'+label+'</small></button>'; });
  h += '</div>';
  return h;
}
function startQuiz(queue, mode, secId){
  quiz = {queue:queue, idx:0, mode:mode, secId:secId||null, sess:{}};
  view = {name:"quiz"};
  render();
}
function quizHTML(){
  const item = quiz.queue[quiz.idx];
  const sec = byId[item.sec];
  const q = sec.questions[item.q];
  const chosen = quiz.sess[quiz.idx];
  const answered = chosen!==undefined;
  const st = statOf(item.sec, item.q);
  let h = '<div class="bar"><button class="btn" data-act="quit">← やめる</button></div>';
  h += '<div class="qmeta">'+item.sec+' '+esc(sec.title)+'　'+(quiz.idx+1)+' / '+quiz.queue.length+' 問'+(quiz.mode==="review" ? '　（解き直し・ランダム順）' : '')+'</div>';
  h += '<div class="qrate">この問題の正答率：'+(st[0]>0 ? pct(st[1], st[0])+'（'+st[0]+'回解いて'+st[1]+'回正解）' : 'まだ解いていません')+'</div>';
  h += '<div class="qtext">'+esc(q.q)+'</div><div class="choices">';
  q.choices.forEach((c,i)=>{
    let cls="choice";
    if(answered){ if(i===q.answer) cls+=" right"; else if(i===chosen) cls+=" wrong"; }
    h += '<button class="'+cls+'" data-act="ans" data-i="'+i+'" '+(answered?"disabled":"")+'><span class="lab">'+LABS[i]+'</span>'+esc(c)+'</button>';
  });
  h += '</div>';
  if(answered){
    const ok = chosen===q.answer;
    h += '<div class="exp"><div class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解（正解は "+LABS[q.answer]+"）")+'</div>'+esc(q.exp)+'</div>';
    const last = quiz.idx >= quiz.queue.length-1;
    h += '<button class="btn accent next" data-act="next">'+(last?"結果を見る":"次の問題へ")+'</button>';
  }
  h += aiButtonsHTML(item.sec, item.q, answered ? chosen : null);
  return h;
}
function runWrongs(){
  return quiz.queue.map((it,i)=>({it:it, chosen:quiz.sess[i]})).filter(x=> x.chosen!==undefined && x.chosen!==byId[x.it.sec].questions[x.it.q].answer);
}
function doneHTML(){
  let h = '<h1>おつかれさま</h1>';
  if(quiz.mode==="section"){
    const st = secStatus(quiz.secId);
    h += '<div class="score">'+quiz.secId+'：正解 '+st.right+' / '+st.total+'</div>';
    if(S.tries[quiz.secId]) h += '<div class="sub">この節のチャレンジ '+S.tries[quiz.secId]+' 回目</div>';
    if(S.best[quiz.secId]!==undefined) h += '<div class="sub">この節の最高正解率 '+pct(S.best[quiz.secId], st.total)+'</div>';
    if(S.sub[quiz.secId]) h += '<div class="sub">この節の結果は送信済みです</div>';
    else h += '<button class="btn accent" data-act="submit">この節の結果をMuseに送る</button><div style="height:8px"></div>';
    const wrongs = runWrongs();
    if(wrongs.length>0){
      h += '<button class="btn accent" data-act="retry-wrong">間違えた問題だけ解き直す</button>';
      h += '<div class="aihead">間違えた問題の解答・解説</div>';
      wrongs.forEach(x=>{
        const sec = byId[x.it.sec]; const q = sec.questions[x.it.q];
        h += '<div class="witem"><div class="wq">'+esc(q.q)+'</div>'
          + '<div class="wa">あなたの回答：'+LABS[x.chosen]+'）'+esc(q.choices[x.chosen])+'<br>正解：'+LABS[q.answer]+'）'+esc(q.choices[q.answer])+'</div>'
          + '<div class="we">'+esc(q.exp)+'</div>'
          + aiButtonsHTML(x.it.sec, x.it.q, x.chosen)
          + '</div>';
      });
    }
    h += '<div style="height:8px"></div><button class="btn" data-act="back-sections">節の一覧へ戻る</button>';
  } else {
    const wrong = wrongList().length;
    h += '<div class="score">解き直し終了</div><div class="sub">残っている間違い：'+wrong+'問</div>';
    const wrongs = runWrongs();
    if(wrongs.length>0){
      h += '<div class="aihead">今回も間違えた問題の解答・解説</div>';
      wrongs.forEach(x=>{
        const sec = byId[x.it.sec]; const q = sec.questions[x.it.q];
        h += '<div class="witem"><div class="wq">'+x.it.sec+' '+esc(q.q)+'</div>'
          + '<div class="wa">あなたの回答：'+LABS[x.chosen]+'）'+esc(q.choices[x.chosen])+'<br>正解：'+LABS[q.answer]+'）'+esc(q.choices[q.answer])+'</div>'
          + '<div class="we">'+esc(q.exp)+'</div>'
          + aiButtonsHTML(x.it.sec, x.it.q, x.chosen)
          + '</div>';
      });
    }
    h += '<button class="btn" data-act="home">章の一覧へ戻る</button>';
  }
  return h;
}
function bind(){
  document.querySelectorAll("[data-ai]").forEach(el=>{
    el.addEventListener("click", ()=>{ window.open(el.getAttribute("data-ai"), "_blank"); });
  });
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const act = el.getAttribute("data-act");
      if(act==="ch"){ view={name:"sections", ch:parseInt(el.getAttribute("data-ch"),10)}; render(); }
      else if(act==="home"){ view={name:"home"}; render(); }
      else if(act==="sec"){ const secId=el.getAttribute("data-sec"); const sec=byId[secId]; startQuiz(sec.questions.map((q,i)=>({sec:secId,q:i})), "section", secId); }
      else if(act==="review"){ const w=wrongList(); if(w.length) startQuiz(shuffle(w), "review", null); }
      else if(act==="ans"){
        const item=quiz.queue[quiz.idx]; const i=parseInt(el.getAttribute("data-i"),10);
        quiz.sess[quiz.idx]=i;
        if(!S.stats[item.sec]) S.stats[item.sec]=[];
        const st = S.stats[item.sec][item.q] || [0,0];
        st[0]++; if(i===byId[item.sec].questions[item.q].answer) st[1]++;
        S.stats[item.sec][item.q]=st;
        if(quiz.mode==="review" && i===byId[item.sec].questions[item.q].answer){
          if(!S.ans[item.sec]) S.ans[item.sec]=[];
          S.ans[item.sec][item.q]=i;
        }
        save(); render();
      }
      else if(act==="next"){
        if(quiz.idx >= quiz.queue.length-1){
          if(quiz.mode==="section" && quiz.queue.length === byId[quiz.secId].questions.length){
            if(!S.ans[quiz.secId]) S.ans[quiz.secId]=[];
            quiz.queue.forEach((it,i)=>{ if(quiz.sess[i]!==undefined) S.ans[quiz.secId][it.q]=quiz.sess[i]; });
            S.tries[quiz.secId] = (S.tries[quiz.secId]||0)+1;
            const st2 = secStatus(quiz.secId);
            if(S.best[quiz.secId]===undefined || st2.right > S.best[quiz.secId]) S.best[quiz.secId] = st2.right;
            save();
          }
          view={name:"done"}; render();
        }
        else{ quiz.idx++; render(); }
      }
      else if(act==="quit"){
        if(quiz.mode==="section"){ view={name:"sections", ch:chOf(quiz.secId)}; }
        else view={name:"home"};
        render();
      }
      else if(act==="retry-wrong"){
        const wrongs = runWrongs().map(x=>x.it);
        if(wrongs.length) startQuiz(shuffle(wrongs), "review", null);
      }
      else if(act==="back-sections"){ view={name:"sections", ch:chOf(quiz.secId)}; render(); }
      else if(act==="submit"){
        const secId=quiz.secId; const st=secStatus(secId);
        const wrongIdx = byId[secId].questions.map((q,i)=>i).filter(i=>{ const a=(S.ans[secId]||[])[i]; return a!==undefined && a!==null && a!==byId[secId].questions[i].answer; });
        S.sub[secId]={r:st.right, t:st.total, w:wrongIdx, at:Date.now()};
        save(); render();
      }
    });
  });
}
render();
</script>

</body>
</html>
